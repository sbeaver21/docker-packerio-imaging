  runs.py: |
    """A Kubernetes Job, described the way the browser needs it.

    Runs are the objects the UI is really about: one Job is one attempt at
    building one image. The interesting question about a run is not "is the Job
    object healthy" but "did the build work, and if not, why not" - so the state
    derived here distinguishes four outcomes the raw status does not:

    ``succeeded``  the Job's Complete condition fired
    ``failed``     the Job's Failed condition fired, or it hit its deadline
    ``running``    a pod exists and is doing something
    ``blocked``    a pod exists but the scheduler will not place it
    ``pending``    the controller has not created a pod yet

    ``blocked`` is the one worth having. The namespace has a hard pod quota of 16
    and every build holds a virtual machine, so the normal way a build fails is
    that it never starts - and a UI that says "pending" for that is lying by
    omission. The scheduler's own message is carried through as ``stateMessage``.
    """

    from __future__ import annotations

    import re
    from datetime import datetime, timezone
    from typing import Any

    from k8stime import elapsed_since, parse_timestamp, seconds_between
    from naming import FAMILY_LABEL, PROJECT_LABEL, is_manual_run

    #: Environment variables that say what a build is actually going to produce.
    #: A whitelist, not the whole environment: pod specs also carry ordinary
    #: configuration and there is no reason to publish all of it.
    INTERESTING_ENV = ("PACKER_PROJECT", "PACKER_BUILD_ARGS", "GIT_REF")

    #: Label written by the Job controller onto every pod it owns.
    JOB_NAME_LABEL = "job-name"

    #: How this repository names its build CronJobs. Used to recover a project name
    #: from a Job that carries no ``packer.io/project`` label.
    PROJECT_PREFIX = "aria-build-"

    #: ``<cronjob>-manual-<yyyymmdd-hhmmss>[-<token>]``: the names this front end
    #: generates for an on-demand run.
    _MANUAL_NAME = re.compile(r"^(.+?)-manual-\d{8}-\d{6}(?:-[a-z0-9]+)?$")

    _TERMINAL_STATES = frozenset({"succeeded", "failed"})


    def _metadata(obj: dict[str, Any]) -> dict[str, Any]:
        return obj.get("metadata") or {}


    def _status(obj: dict[str, Any]) -> dict[str, Any]:
        return obj.get("status") or {}


    def _pod_template(job: dict[str, Any]) -> dict[str, Any]:
        spec = job.get("spec") or {}
        template = spec.get("template") or {}
        return template.get("spec") or {}


    def owning_cronjob(job: dict[str, Any]) -> str:
        """The CronJob a Job belongs to, as best it can be determined.

        Three sources, in decreasing order of authority:

        1. ``ownerReferences`` - what the CronJob controller sets on the Jobs its
           own schedule creates. This is the only one that is always right, but it
           is absent on Jobs created by hand.
        2. The ``app.kubernetes.io/name`` label, which this front end stamps on the
           Jobs it starts. It has to: a copied job template carries the pod labels
           but not the Job's own, so nothing else would identify the parent.
        3. The name, for anything named ``<cronjob>-manual-<timestamp>``.

        ``kubectl create job --from=cronjob/X`` produces none of these, so a Job
        started that way is still identified by its ``packer.io/project`` label in
        :func:`build_project`. A Job with neither is simply a run with no CronJob
        behind it, and the UI shows it as such rather than hiding it.
        """
        meta = _metadata(job)
        for reference in meta.get("ownerReferences") or []:
            if reference.get("kind") == "CronJob" and reference.get("name"):
                return str(reference["name"])
        labels = meta.get("labels") or {}
        named = labels.get("app.kubernetes.io/name")
        if named:
            return str(named)
        match = _MANUAL_NAME.match(str(meta.get("name") or ""))
        if match:
            return match.group(1)
        return ""


    def build_project(job: dict[str, Any]) -> str:
        """What a Job builds: its project label, else its CronJob's name."""
        labels = _metadata(job).get("labels") or {}
        project = labels.get(PROJECT_LABEL)
        if project:
            return str(project)
        cronjob = owning_cronjob(job)
        if cronjob.startswith(PROJECT_PREFIX):
            return cronjob[len(PROJECT_PREFIX) :]
        return cronjob


    def container_names(job: dict[str, Any], key: str) -> list[str]:
        """Names of the regular or init containers in a Job's pod template."""
        return [
            container.get("name", "")
            for container in (_pod_template(job).get(key) or [])
            if container.get("name")
        ]


    def default_container(job: dict[str, Any]) -> str:
        """The container whose log a person most likely wants.

        That is the last regular container: the build itself runs in it, while the
        ones before it are sidecars. The init containers are deliberately not
        eligible - they are offered separately because their logs matter only when
        the setup step went wrong, such as a failed repository clone.
        """
        regular = container_names(job, "containers")
        return regular[-1] if regular else ""


    def build_parameters(job: dict[str, Any]) -> dict[str, str]:
        """The whitelisted environment of the main container.

        Reads only literal ``value`` entries. Anything sourced from a Secret or a
        ConfigMap (``valueFrom``) has no value in the spec and is skipped - which
        is the point: the Packer credentials never reach this dict.
        """
        target = default_container(job)
        for container in _pod_template(job).get("containers") or []:
            if container.get("name") != target:
                continue
            parameters: dict[str, str] = {}
            for entry in container.get("env") or []:
                name = entry.get("name")
                value = entry.get("value")
                if name in INTERESTING_ENV and isinstance(value, str):
                    parameters[name] = value
            return parameters
        return {}


    def _condition(conditions: list[dict[str, Any]], wanted: str) -> dict[str, Any] | None:
        for condition in conditions or []:
            if condition.get("type") == wanted and str(condition.get("status")) == "True":
                return condition
        return None


    def _scheduling_problem(pods: list[dict[str, Any]]) -> tuple[str, str] | None:
        """The scheduler's refusal for the first pod it will not place."""
        for pod in pods:
            for condition in _status(pod).get("conditions") or []:
                if condition.get("type") != "PodScheduled":
                    continue
                if str(condition.get("status")) != "False":
                    continue
                if condition.get("reason") != "Unschedulable":
                    continue
                message = str(condition.get("message") or "").strip()
                return ("Unschedulable", message or "the scheduler will not place this pod")
        return None


    def _pod_summary(pods: list[dict[str, Any]]) -> dict[str, Any] | None:
        """Describe the pod a Job is currently running, if there is one.

        A retried Job can have several pods; the newest is the one that matters,
        which is also the one the logs come from.
        """
        if not pods:
            return None
        newest = max(
            pods,
            key=lambda pod: str(_metadata(pod).get("creationTimestamp") or ""),
        )
        status = _status(newest)
        statuses = status.get("containerStatuses") or []
        restarts = sum(int((entry.get("restartCount") or 0)) for entry in statuses)
        ready = bool(statuses) and all(entry.get("ready") for entry in statuses)
        return {
            "name": _metadata(newest).get("name", ""),
            "phase": status.get("phase", ""),
            "nodeName": (newest.get("spec") or {}).get("nodeName", ""),
            "ready": ready,
            "restarts": restarts,
            "startTime": status.get("startTime", ""),
        }


    def derive_state(job: dict[str, Any], pods: list[dict[str, Any]] | None) -> tuple[str, str, str]:
        """Return ``(state, reason, message)`` for a Job.

        ``reason`` is a short machine-ish token, ``message`` is the sentence worth
        showing a person. Both are empty when there is nothing to say.
        """
        status = _status(job)
        conditions = status.get("conditions") or []

        if _condition(conditions, "Complete") is not None:
            return ("succeeded", "Complete", "")
        failed = _condition(conditions, "Failed")
        if failed is not None:
            reason = str(failed.get("reason") or "Failed")
            message = str(failed.get("message") or "").strip()
            return ("failed", reason, message)

        problem = _scheduling_problem(pods or [])
        if problem is not None:
            return ("blocked", problem[0], problem[1])

        active = int(status.get("active") or 0)
        if active > 0:
            return ("running", "Active", "")
        if status.get("startTime"):
            # Started but nothing active and no terminal condition yet: the pod is
            # being created, or was just deleted and the controller is reacting.
            return ("running", "Starting", "")
        return ("pending", "Queued", "")


    def summarise_run(
        job: dict[str, Any],
        pods: list[dict[str, Any]] | None = None,
        now: datetime | None = None,
    ) -> dict[str, Any]:
        """Turn a Job object into the run dictionary the API returns."""
        meta = _metadata(job)
        status = _status(job)
        spec = job.get("spec") or {}
        labels = dict(meta.get("labels") or {})
        annotations = dict(meta.get("annotations") or {})

        state, reason, message = derive_state(job, pods)

        started = parse_timestamp(status.get("startTime"))
        finished = parse_timestamp(status.get("completionTime"))
        moment = now or datetime.now(timezone.utc)
        duration = (
            seconds_between(started, finished)
            if finished is not None
            else elapsed_since(started, moment)
        )

        cronjob = owning_cronjob(job)
        project = build_project(job)

        return {
            "name": meta.get("name", ""),
            "namespace": meta.get("namespace", ""),
            "cronjob": cronjob,
            "project": project,
            "family": labels.get(FAMILY_LABEL) or "",
            "state": state,
            "stateReason": reason,
            "stateMessage": message,
            "createdAt": meta.get("creationTimestamp") or "",
            "startTime": status.get("startTime") or "",
            "completionTime": status.get("completionTime") or "",
            "durationSeconds": duration,
            "active": int(status.get("active") or 0),
            "succeeded": int(status.get("succeeded") or 0),
            "failed": int(status.get("failed") or 0),
            "manual": is_manual_run(labels, annotations),
            "labels": labels,
            "annotations": annotations,
            "backoffLimit": spec.get("backoffLimit"),
            "activeDeadlineSeconds": spec.get("activeDeadlineSeconds"),
            "ttlSecondsAfterFinished": spec.get("ttlSecondsAfterFinished"),
            "containers": container_names(job, "containers"),
            "initContainers": container_names(job, "initContainers"),
            "defaultContainer": default_container(job),
            "parameters": build_parameters(job),
            "pod": _pod_summary(pods or []),
            "deletionTimestamp": meta.get("deletionTimestamp") or "",
        }


    def is_terminal(run: dict[str, Any]) -> bool:
        """Whether a run has finished, one way or the other."""
        return run.get("state") in _TERMINAL_STATES


    def sort_key(run: dict[str, Any]) -> str:
        """Newest first, using the same string the API sorts by."""
        return str(run.get("createdAt") or "")
  services.py: |
    """The long-lived objects a request needs, attached to the app at start-up.

    Passing the configuration and the Kubernetes gateway through Flask's
    ``app.extensions`` keeps the blueprints free of module-level globals - two
    applications in one process (which is how the tests run) do not share state.
    """

    from __future__ import annotations

    from dataclasses import dataclass

    from flask import current_app

    from config import Settings
    from kube import Gateway

    #: Key under which the services are registered in ``app.extensions``.
    EXTENSION_KEY = "aria.services"


    @dataclass(frozen=True)
    class Services:
        """Everything a view needs that is not part of the request."""

        settings: Settings
        gateway: Gateway


    def register(app, services: Services) -> None:
        """Attach the services to an app, once, before it serves anything."""
        app.extensions[EXTENSION_KEY] = services


    def current_services() -> Services:
        """The services for the app handling this request."""
        services: Services = current_app.extensions[EXTENSION_KEY]
        return services
  static.build.js: |
    /* ==========================================================================
       The Build page: one card per CronJob, with the actions that belong to it.

       Everything here reads from the snapshot the shell hands over; the two write
       actions post to /api and then ask for a fresh snapshot rather than patching
       the card in place, so what is on screen is always something the cluster
       actually said.
       ========================================================================== */

    "use strict";

    (function () {
      const {
        CONFIG,
        ACTIVE_STATES,
        h,
        fill,
        $,
        api,
        toast,
        formatDuration,
        formatRelative,
        formatAbsolute,
        stateLabel,
        healthBadge,
        onSnapshot,
        refresh,
        start,
      } = window.App;

      function chip(label, value) {
        return h(
          "span",
          { class: "chip" },
          h("span", { class: "chip-key", text: label }),
          value instanceof Node ? value : h("code", { text: value }),
        );
      }

      /** The line under a card's title: why it is paused, or why the last run failed. */
      function projectNote(project) {
        if (project.suspend) {
          return "Schedule paused: nothing will start by itself until it is resumed.";
        }
        const latest = project.latestRun;
        if (latest && (latest.state === "blocked" || latest.state === "failed") && latest.stateMessage) {
          return latest.stateMessage;
        }
        return "";
      }

      function lastRunRow(latest) {
        if (!latest) return h("p", { class: "card-run", text: "never run" });
        return h(
          "p",
          { class: "card-run" },
          stateLabel(latest.state),
          h("span", { title: formatAbsolute(latest.createdAt), text: formatRelative(latest.createdAt) }),
          latest.durationSeconds !== null && latest.durationSeconds !== undefined
            ? h("span", { text: `· ${formatDuration(latest.durationSeconds)}` })
            : null,
          latest.manual ? h("span", { text: "· manual" }) : null,
        );
      }

      function projectCard(project) {
        const latest = project.latestRun;
        const schedule = project.schedule
          ? `${project.schedule}${project.timezone ? ` ${project.timezone}` : ""}`
          : "no schedule";

        const chips = [];
        if (project.family) chips.push(chip("family", project.family));
        chips.push(chip("schedule", schedule));
        if (project.parameters && project.parameters.PACKER_PROJECT) {
          chips.push(chip("path", project.parameters.PACKER_PROJECT));
        }
        if (project.parameters && project.parameters.PACKER_BUILD_ARGS) {
          chips.push(chip("args", project.parameters.PACKER_BUILD_ARGS));
        }
        // The Secret holding the variable files: the one thing that stops a build
        // before Packer even starts, so it belongs on the card.
        for (const secret of project.requiredSecrets || []) {
          chips.push(chip("secret", secret));
        }
        if (project.concurrencyPolicy === "Forbid" && project.activeRuns > 0) {
          chips.push(chip("note", "a run is in progress, a new one waits"));
        }

        const note = projectNote(project);
        const actions = [];

        if (CONFIG.canMutate) {
          actions.push(
            h("button", {
              type: "button",
              class: "btn btn-primary",
              text: latest && ACTIVE_STATES.has(latest.state) ? "Build again" : "Build now",
              title: "Start one run now, exactly as the schedule would",
              onclick: (event) => startBuild(project.name, event.currentTarget),
            }),
          );
          actions.push(
            h("button", {
              type: "button",
              class: "btn btn-quiet",
              text: project.suspend ? "Resume" : "Pause",
              title: project.suspend
                ? "Re-enable the schedule"
                : "Stop the schedule starting runs; a run already going continues",
              onclick: (event) => toggleSuspend(project, event.currentTarget),
            }),
          );
        }
        actions.push(
          h("a", {
            class: "btn btn-quiet",
            href: `/runs?project=${encodeURIComponent(project.name)}`,
            text: "Runs",
            title: "Show this project's runs",
          }),
        );

        return h(
          "article",
          { class: "project-card", dataset: { health: project.health, project: project.name } },
          h(
            "div",
            { class: "card-head" },
            h(
              "div",
              {},
              h("h3", { class: "card-title", text: project.project || project.name }),
              h("code", { class: "card-name", text: project.name }),
            ),
            healthBadge(project.health),
          ),
          project.purpose ? h("p", { class: "card-purpose", text: project.purpose }) : null,
          h("div", { class: "chips" }, chips),
          lastRunRow(latest),
          note ? h("p", { class: "card-note", text: note }) : null,
          h("div", { class: "card-actions" }, actions),
        );
      }

      /** Runs whose CronJob is gone: worth showing, impossible to start again. */
      function orphanCard(orphan) {
        return h(
          "article",
          { class: "project-card", dataset: { health: "orphan", project: orphan.name } },
          h(
            "div",
            { class: "card-head" },
            h(
              "div",
              {},
              h("h3", { class: "card-title", text: orphan.project || orphan.name }),
              h("code", { class: "card-name", text: orphan.name }),
            ),
            healthBadge("orphan"),
          ),
          h("p", {
            class: "card-purpose",
            text: "These runs belong to a CronJob that no longer exists, so they cannot be started again. Delete them from the Runs page when the history is no longer needed.",
          }),
          h("div", { class: "chips" }, chip("runs", String(orphan.runCount))),
          h(
            "div",
            { class: "card-actions" },
            h("a", {
              class: "btn btn-quiet",
              href: `/runs?project=${encodeURIComponent(orphan.name)}`,
              text: "Runs",
            }),
          ),
        );
      }

      function render(snapshot) {
        const host = $("project-grid");
        const projects = snapshot.projects || [];
        const orphans = snapshot.orphanProjects || [];

        $("project-count").textContent = String(projects.length);

        if (!projects.length && !orphans.length) {
          fill(
            host,
            h("p", {
              class: "muted",
              text:
                `No build CronJobs in namespace ${snapshot.namespace}. They come from ` +
                "the packer-imaging chart: kubernetes/charts/packer-imaging.",
            }),
          );
          return;
        }

        fill(host, projects.map(projectCard), orphans.map(orphanCard));
      }

      /* ------------------------------------------------------------------------
         Actions
         ------------------------------------------------------------------------ */

      async function startBuild(cronjobName, button) {
        if (!CONFIG.canMutate || !button) return;
        const label = button.textContent;
        button.disabled = true;
        button.textContent = "Starting…";
        try {
          const result = await api(`/api/projects/${encodeURIComponent(cronjobName)}/runs`, {
            method: "POST",
          });
          toast(result.message || "Build started", "success");
          await refresh();
        } catch (error) {
          toast(`Could not start the build: ${error.message}`, "error");
        } finally {
          // The card is rebuilt from the next snapshot, so this only matters when
          // the request failed and the card is still the same one.
          button.disabled = false;
          button.textContent = label;
        }
      }

      async function toggleSuspend(project, button) {
        if (!CONFIG.canMutate || !button) return;
        const next = !project.suspend;
        button.disabled = true;
        try {
          const result = await api(`/api/projects/${encodeURIComponent(project.name)}`, {
            method: "PATCH",
            body: JSON.stringify({ suspend: next }),
          });
          toast(result.message || "Schedule updated", "success");
          await refresh();
        } catch (error) {
          toast(`Could not change the schedule: ${error.message}`, "error");
          button.disabled = false;
        }
      }

      onSnapshot(render);
      start();
    })();
  static.core.js: |
    /* ==========================================================================
       Image Builder - shared browser code.

       Loaded by every page, before the page's own script. It owns the parts that
       are the same everywhere:

         * the DOM helpers and the formatters;
         * transport, toasts and the error banner;
         * the connection indicator and the polling loop;
         * the theme.

       The rules that hold throughout:

         1. No HTML is ever built from a string. Every node is created with
            createElement and every value is assigned to textContent, so a project
            name or a scheduler message cannot become markup.
         2. Nothing is read from the cluster except through /api.
         3. A page draws itself from one snapshot. Each page registers a renderer,
            and every renderer is called with the same object, so nothing on screen
            can disagree with anything else on it.

       A page script does not start anything: it registers and returns, and
       App.start() begins polling once the whole document is ready.
       ========================================================================== */

    "use strict";

    window.App = (function () {
      const body = document.body;

      const CONFIG = {
        page: body.dataset.page || "",
        refreshSeconds: Math.max(5, Number(body.dataset.refreshSeconds) || 15),
        canMutate: body.dataset.canMutate === "true",
        logTail: Math.max(50, Number(body.dataset.logTail) || 2000),
      };

      /* ------------------------------------------------------------------------
         DOM helpers
         ------------------------------------------------------------------------ */

      /** Create an element. Props: class, text, dataset, on<Event>; anything else
       *  is an attribute. Children may be nodes, strings, or nested arrays. */
      function h(tag, props, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props || {})) {
          if (value === null || value === undefined || value === false) continue;
          if (key === "class") {
            node.className = value;
          } else if (key === "text") {
            node.textContent = String(value);
          } else if (key === "dataset") {
            Object.assign(node.dataset, value);
          } else if (key.startsWith("on") && typeof value === "function") {
            node.addEventListener(key.slice(2).toLowerCase(), value);
          } else if (value === true) {
            node.setAttribute(key, "");
          } else {
            node.setAttribute(key, String(value));
          }
        }
        append(node, children);
        return node;
      }

      function append(node, children) {
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue;
          node.append(child instanceof Node ? child : document.createTextNode(String(child)));
        }
      }

      const $ = (id) => document.getElementById(id);

      /** Replace every child of `node` with `children`. */
      function fill(node, ...children) {
        node.replaceChildren();
        append(node, children);
      }

      /* ------------------------------------------------------------------------
         Formatting
         ------------------------------------------------------------------------ */

      const RELATIVE = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
      const MINUTE = 60;
      const HOUR = 3600;
      const DAY = 86400;
      const MONTH = 2592000;

      /** "45s", "12m 30s", "3h 5m", "2d 4h" - a build takes tens of minutes. */
      function formatDuration(seconds) {
        if (seconds === null || seconds === undefined || Number.isNaN(seconds)) return "—";
        const value = Math.max(0, Math.round(seconds));
        if (value < MINUTE) return `${value}s`;
        const minutes = Math.floor(value / MINUTE);
        if (minutes < 60) return `${minutes}m ${value % 60}s`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ${minutes % 60}m`;
        return `${Math.floor(hours / 24)}d ${hours % 24}h`;
      }

      function formatRelative(iso) {
        if (!iso) return "—";
        const moment = new Date(iso);
        if (Number.isNaN(moment.getTime())) return "—";
        const delta = Math.round((moment.getTime() - Date.now()) / 1000);
        const magnitude = Math.abs(delta);
        if (magnitude < 45) return "just now";
        if (magnitude < HOUR) return RELATIVE.format(Math.round(delta / MINUTE), "minute");
        if (magnitude < DAY) return RELATIVE.format(Math.round(delta / HOUR), "hour");
        if (magnitude < MONTH) return RELATIVE.format(Math.round(delta / DAY), "day");
        return moment.toLocaleDateString();
      }

      function formatAbsolute(iso) {
        if (!iso) return "";
        const moment = new Date(iso);
        return Number.isNaN(moment.getTime()) ? "" : moment.toLocaleString();
      }

      /** The build arguments a run carries, for the line under its name.
       *
       * The project is deliberately not in here: every caller already prints it in
       * its own column, and repeating it made a run's row read
       * "name / scheduled - name / name".
       */
      function buildSummary(run) {
        const parameters = run.parameters || {};
        return parameters.PACKER_BUILD_ARGS || "";
      }

      const STATE_TEXT = {
        succeeded: "succeeded",
        failed: "failed",
        running: "running",
        blocked: "blocked",
        pending: "pending",
      };

      function stateLabel(state) {
        return h("span", {
          class: "state-label",
          dataset: { state: state || "pending" },
          text: STATE_TEXT[state] || state || "unknown",
        });
      }

      const HEALTH_TEXT = {
        ok: "healthy",
        failing: "failing",
        running: "running",
        suspended: "paused",
        never: "never run",
        orphan: "orphaned",
      };

      function healthBadge(health) {
        const key = HEALTH_TEXT[health] ? health : "never";
        return h(
          "span",
          { class: "health", dataset: { health: key } },
          h("span", { class: "health-dot", "aria-hidden": "true" }),
          HEALTH_TEXT[key],
        );
      }

      /** States in which a run has not finished, and a second one would queue. */
      const ACTIVE_STATES = new Set(["running", "blocked", "pending"]);

      /* ------------------------------------------------------------------------
         Transport
         ------------------------------------------------------------------------ */

      async function api(path, options) {
        const settings = options || {};
        const headers = { Accept: "application/json", ...(settings.headers || {}) };
        if (settings.body !== undefined) headers["Content-Type"] = "application/json";

        const response = await fetch(path, { ...settings, headers });
        let payload = null;
        try {
          payload = await response.json();
        } catch (error) {
          payload = null;
        }
        if (!response.ok) {
          const message =
            (payload && payload.error) || `${response.status} ${response.statusText || "request failed"}`;
          const failure = new Error(message);
          failure.status = response.status;
          throw failure;
        }
        return payload;
      }

      /* ------------------------------------------------------------------------
         Toasts and the banner
         ------------------------------------------------------------------------ */

      function toast(message, kind) {
        const host = $("toasts");
        if (!host) return;
        const item = h(
          "div",
          { class: "toast", dataset: { kind: kind || "info" } },
          h("span", { class: "toast-text", text: message }),
        );
        host.append(item);
        const remove = () => item.remove();
        const timer = setTimeout(remove, kind === "error" ? 10000 : 5000);
        item.addEventListener("click", () => {
          clearTimeout(timer);
          remove();
        });
        while (host.children.length > 4) host.firstElementChild.remove();
      }

      let bannerTimer = null;

      function showBanner(message) {
        $("banner-text").textContent = message;
        $("banner").hidden = false;
      }

      function hideBanner() {
        $("banner").hidden = true;
        $("banner-text").textContent = "";
      }

      function fail(message) {
        // A repeated poll failure must not stack identical banners; one is enough.
        if (bannerTimer) return;
        showBanner(message);
        bannerTimer = setTimeout(() => {
          bannerTimer = null;
        }, 15000);
      }

      /* ------------------------------------------------------------------------
         Connection indicator
         ------------------------------------------------------------------------ */

      function renderConnection(connected, detail) {
        const node = $("connection");
        if (!node) return;
        const label = node.querySelector(".conn-text");
        node.dataset.state = connected ? "connected" : "unavailable";
        label.textContent = connected ? "connected" : "disconnected";
        node.title = detail || "";
      }

      /* ------------------------------------------------------------------------
         Theme

         The stylesheet has two palettes: the light one on :root, and a terminal
         palette after k9s on :root[data-theme="dark"]. The head script has already
         resolved the stored preference to a concrete theme before the first paint,
         so nothing here can cause a flash - this drives the toggle and keeps
         "auto" honest when the operating system changes its mind.
         ------------------------------------------------------------------------ */

      const THEME_KEY = "aria-image-builder-theme";
      const THEME_ORDER = ["auto", "dark", "light"];
      const THEME_LABEL = {
        auto: "follow the system",
        dark: "dark",
        light: "light",
      };

      const darkQuery = window.matchMedia
        ? window.matchMedia("(prefers-color-scheme: dark)")
        : null;

      /** The ?theme= override, or null. Read-only: it never writes a preference. */
      function forcedTheme() {
        try {
          const value = new URLSearchParams(window.location.search).get("theme");
          return THEME_ORDER.includes(value) ? value : null;
        } catch (error) {
          return null;
        }
      }

      function storedTheme() {
        try {
          const raw = window.localStorage.getItem(THEME_KEY);
          return THEME_ORDER.includes(raw) ? raw : "auto";
        } catch (error) {
          // A browser with storage disabled still gets a working page, just
          // without the preference remembered.
          return "auto";
        }
      }

      function applyTheme(mode) {
        const wantsDark =
          mode === "dark" || (mode === "auto" && darkQuery !== null && darkQuery.matches);
        document.documentElement.setAttribute("data-theme", wantsDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-mode", mode);

        const button = $("theme-button");
        if (!button) return;
        button.dataset.mode = mode;
        const label = `Theme: ${THEME_LABEL[mode]}`;
        button.setAttribute("aria-label", label);
        button.title = label;
        for (const icon of button.querySelectorAll(".theme-icon")) {
          icon.hidden = !icon.classList.contains(`theme-icon-${mode}`);
        }
      }

      function setTheme(mode) {
        try {
          window.localStorage.setItem(THEME_KEY, mode);
        } catch (error) {
          // Private browsing, or storage disabled: the theme still applies for
          // this page view, it just will not come back on the next one.
        }
        applyTheme(mode);
      }

      function wireTheme() {
        // ?theme= beats the stored preference for this page view; without this the
        // head script's choice would be undone as soon as the page finished loading.
        applyTheme(forcedTheme() || storedTheme());

        const button = $("theme-button");
        if (button) {
          button.addEventListener("click", () => {
            const current = button.dataset.mode || "auto";
            const next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
            // A click is a decision, so drop the one-off override: the address bar
            // must not claim a theme the page no longer shows.
            if (forcedTheme() !== null) {
              try {
                const url = new URL(window.location.href);
                url.searchParams.delete("theme");
                window.history.replaceState(null, "", url);
              } catch (error) {
                // Not worth failing over; the stored preference is still correct.
              }
            }
            setTheme(next);
          });
        }

        if (darkQuery === null) return;
        const followSystem = () => {
          if ((document.documentElement.getAttribute("data-theme-mode") || "auto") === "auto") {
            applyTheme("auto");
          }
        };
        if (darkQuery.addEventListener) {
          darkQuery.addEventListener("change", followSystem);
        } else if (darkQuery.addListener) {
          // Safari before 14.
          darkQuery.addListener(followSystem);
        }
      }

      /* ------------------------------------------------------------------------
         The snapshot pipeline
         ------------------------------------------------------------------------ */

      const renderers = [];
      let snapshot = null;

      /** Register a function to draw this page from a snapshot. */
      function onSnapshot(renderer) {
        renderers.push(renderer);
      }

      function render(next) {
        snapshot = next;
        renderConnection(true, `Kubernetes ${next.serverVersion || "(version unknown)"}`);
        hideBanner();

        $("foot-namespace").textContent = next.namespace;
        $("foot-refresh").textContent = String(next.refreshSeconds || CONFIG.refreshSeconds);
        $("foot-updated").textContent = `updated ${formatRelative(next.generatedAt)}`;

        for (const draw of renderers) draw(next);
      }

      let refreshing = false;

      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          render(await api("/api/overview"));
        } catch (error) {
          renderConnection(false, error.message);
          fail(`Cannot read the cluster: ${error.message}`);
        } finally {
          refreshing = false;
        }
      }

      async function checkHealth() {
        try {
          const health = await api("/api/health");
          if (health.kubernetes === "connected") {
            renderConnection(true, `Kubernetes ${health.serverVersion || ""}`.trim());
          } else {
            renderConnection(false, health.error || "the API server is not reachable");
            if (health.error) fail(`The cluster is not reachable: ${health.error}`);
          }
        } catch (error) {
          renderConnection(false, error.message);
          fail(`The image builder is not answering: ${error.message}`);
        }
      }

      let pollTimer = null;

      function scheduleRefresh() {
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = setTimeout(async () => {
          if (!document.hidden) await refresh();
          scheduleRefresh();
        }, CONFIG.refreshSeconds * 1000);
      }

      /** The snapshot most recently drawn, or null before the first one. */
      function current() {
        return snapshot;
      }

      /* ------------------------------------------------------------------------
         Wiring and start-up
         ------------------------------------------------------------------------ */

      function wireChrome() {
        const refreshButton = $("refresh-button");
        if (refreshButton) {
          refreshButton.addEventListener("click", async () => {
            await checkHealth();
            await refresh();
          });
        }

        const bannerClose = $("banner-close");
        if (bannerClose) bannerClose.addEventListener("click", hideBanner);

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) refresh();
        });
      }

      function start() {
        wireTheme();
        wireChrome();
        checkHealth().then(refresh).then(scheduleRefresh);
      }

      return {
        CONFIG,
        ACTIVE_STATES,
        h,
        append,
        fill,
        $,
        api,
        toast,
        fail,
        hideBanner,
        formatDuration,
        formatRelative,
        formatAbsolute,
        buildSummary,
        stateLabel,
        healthBadge,
        renderConnection,
        onSnapshot,
        current,
        refresh,
        start,
      };
    })();
  static.landing.js: |
    /* ==========================================================================
       The landing page: what state the namespace is in, at a glance.

       Deliberately read-only. It answers "is anything wrong" and "what happened
       recently", and hands you off to Build or Runs with a link that carries the
       filter you wanted, rather than offering the same controls on three pages.
       ========================================================================== */

    "use strict";

    (function () {
      const {
        h,
        fill,
        $,
        formatDuration,
        formatRelative,
        formatAbsolute,
        stateLabel,
        buildSummary,
        onSnapshot,
        start,
      } = window.App;

      /* ------------------------------------------------------------------------
         At a glance
         ------------------------------------------------------------------------ */

      function statCard(label, value, note) {
        return h(
          "div",
          { class: "stat-card" },
          h("p", { class: "stat-label", text: label }),
          h("p", { class: "stat-value", text: value }),
          note ? h("p", { class: "stat-note", text: note }) : null,
        );
      }

      function renderStats(snapshot) {
        const counts = snapshot.counts || {};
        fill(
          $("stat-grid"),
          statCard("Projects", String(counts.projects || 0), "build CronJobs defined"),
          statCard("Runs", String(counts.runs || 0), "Jobs kept by the TTL"),
          statCard("Active now", String(counts.active || 0), "running, queued or blocked"),
          statCard(
            "Cluster",
            snapshot.serverVersion || "unknown",
            `${snapshot.namespace} · read ${formatRelative(snapshot.generatedAt)}`,
          ),
        );
      }

      /* ------------------------------------------------------------------------
         Capacity
         ------------------------------------------------------------------------ */

      function renderCapacity(capacity) {
        const host = $("capacity-grid");
        const resources = (capacity && capacity.resources) || [];
        if (!resources.length) {
          fill(host, h("p", { class: "muted", text: "No ResourceQuota is defined for this namespace." }));
          return;
        }
        fill(
          host,
          resources.map((resource) => {
            const percent = resource.percent === null ? null : Math.max(0, Math.min(100, resource.percent));
            return h(
              "div",
              {
                class: "capacity-card",
                dataset: { saturated: String(Boolean(resource.saturated)) },
                title:
                  percent === null
                    ? `${resource.label}: ${resource.used} of ${resource.hard}`
                    : `${resource.label}: ${resource.used} of ${resource.hard} (${percent}%)`,
              },
              h("p", { class: "capacity-label", text: resource.label }),
              h(
                "p",
                { class: "capacity-value" },
                h("span", { class: "capacity-used", text: resource.used }),
                h("span", { class: "capacity-hard", text: `/ ${resource.hard}` }),
              ),
              h(
                "div",
                { class: "capacity-track" },
                h("div", {
                  class: "capacity-fill",
                  style: `width:${percent === null ? 0 : percent}%`,
                }),
              ),
            );
          }),
        );
      }

      /* ------------------------------------------------------------------------
         Needs attention

         Three things earn a row: a schedule someone paused, a project whose last
         run failed, and a run the scheduler could not place. Everything else is
         ordinary and belongs on the pages that are about it.
         ------------------------------------------------------------------------ */

      function attentionItem(tone, title, detail, href, linkText) {
        return h(
          "div",
          { class: "attention-item", dataset: { tone } },
          h("span", { class: "attention-dot", "aria-hidden": "true" }),
          h(
            "div",
            { class: "attention-body" },
            h("p", { class: "attention-title", text: title }),
            detail ? h("p", { class: "attention-detail", text: detail }) : null,
          ),
          h("a", { class: "attention-link", href, text: linkText }),
        );
      }

      function renderAttention(snapshot) {
        const items = [];

        for (const project of snapshot.projects || []) {
          const name = project.project || project.name;
          if (project.suspend) {
            items.push(
              attentionItem(
                "warn",
                `${name} is paused`,
                "No run will start on its own until the schedule is resumed.",
                `/build#${encodeURIComponent(project.name)}`,
                "Open",
              ),
            );
            continue;
          }
          const latest = project.latestRun;
          if (latest && latest.state === "failed") {
            items.push(
              attentionItem(
                "bad",
                `${name} failed`,
                latest.stateMessage || "The last run did not finish.",
                `/runs?project=${encodeURIComponent(project.name)}&show=failed`,
                "Logs",
              ),
            );
          }
        }

        // Blocked runs can belong to a project that is otherwise healthy, so they
        // are listed on their own rather than through the project card.
        for (const run of snapshot.runs || []) {
          if (run.state !== "blocked") continue;
          items.push(
            attentionItem(
              "warn",
              `${run.project || run.name} is waiting for capacity`,
              run.stateMessage || "The scheduler will not place its pod.",
              `/runs?project=${encodeURIComponent(run.cronjob || "")}&show=active`,
              "Open",
            ),
          );
        }

        $("attention-count").textContent = String(items.length);

        if (!items.length) {
          fill(
            $("attention-list"),
            h("p", {
              class: "muted",
              text: "Nothing is paused, failing or waiting for a pod.",
            }),
          );
          return;
        }

        fill($("attention-list"), items);
      }

      /* ------------------------------------------------------------------------
         Latest runs
         ------------------------------------------------------------------------ */

      const RECENT_LIMIT = 5;

      function recentRow(run) {
        const summary = buildSummary(run);
        return h(
          "tr",
          {},
          h(
            "td",
            {},
            h("code", { class: "run-name", title: run.name, text: run.name }),
            h("span", {
              class: "run-sub",
              text: `${run.manual ? "manual" : "scheduled"}${summary ? ` · ${summary}` : ""}`,
            }),
          ),
          h("td", { class: "run-project", text: run.project || "—" }),
          h("td", { class: "cell-state" }, stateLabel(run.state)),
          h(
            "td",
            { class: "num cell-started", title: formatAbsolute(run.startTime || run.createdAt) },
            formatRelative(run.startTime || run.createdAt),
          ),
          h("td", { class: "num cell-took", text: formatDuration(run.durationSeconds) }),
        );
      }

      function renderRecent(snapshot) {
        const rows = $("recent-rows");
        const runs = (snapshot.runs || []).slice(0, RECENT_LIMIT);
        if (!runs.length) {
          fill(
            rows,
            h("tr", { class: "row-empty" }, h("td", { colspan: "5", text: "No runs yet." })),
          );
          return;
        }
        fill(rows, runs.map(recentRow));
      }

      /* ------------------------------------------------------------------------
         Draw
         ------------------------------------------------------------------------ */

      function render(snapshot) {
        renderStats(snapshot);
        renderCapacity(snapshot.capacity);
        renderAttention(snapshot);
        renderRecent(snapshot);
      }

      onSnapshot(render);
      start();
    })();
  static.runs.js: |
    /* ==========================================================================
       The Runs page: every Job, the filters on top, a log viewer, and delete.

       The filters live in the address bar as well as in the controls, so a link to
       "the failed runs of one project" is a link someone can send to a colleague.
       The Build page uses that: its Runs button points at /runs?project=<name>.
       ========================================================================== */

    "use strict";

    (function () {
      const {
        CONFIG,
        ACTIVE_STATES,
        h,
        fill,
        $,
        api,
        toast,
        formatDuration,
        formatRelative,
        formatAbsolute,
        buildSummary,
        stateLabel,
        onSnapshot,
        current,
        refresh,
        start,
      } = window.App;

      const FILTERS = new Set(["all", "active", "failed", "succeeded"]);

      const view = {
        runFilter: "all",
        projectFilter: "all",
      };

      /* ------------------------------------------------------------------------
         Filters
         ------------------------------------------------------------------------ */

      /** Take the starting filters from the query string, ignoring nonsense. */
      function readFiltersFromUrl() {
        let params = null;
        try {
          params = new URLSearchParams(window.location.search);
        } catch (error) {
          return;
        }
        const show = params.get("show");
        if (FILTERS.has(show)) view.runFilter = show;
        const project = params.get("project");
        if (project) view.projectFilter = project;
      }

      /** Keep the address bar in step, so the current view can be linked or kept. */
      function writeFiltersToUrl() {
        try {
          const url = new URL(window.location.href);
          if (view.runFilter === "all") {
            url.searchParams.delete("show");
          } else {
            url.searchParams.set("show", view.runFilter);
          }
          if (view.projectFilter === "all") {
            url.searchParams.delete("project");
          } else {
            url.searchParams.set("project", view.projectFilter);
          }
          if (url.href !== window.location.href) {
            window.history.replaceState(null, "", url);
          }
        } catch (error) {
          // A browser that refuses history is still a working page.
        }
      }

      function runMatchesFilters(run) {
        if (view.projectFilter !== "all" && run.cronjob !== view.projectFilter) return false;
        switch (view.runFilter) {
          case "active":
            return ACTIVE_STATES.has(run.state);
          case "failed":
            return run.state === "failed";
          case "succeeded":
            return run.state === "succeeded";
          default:
            return true;
        }
      }

      /* ------------------------------------------------------------------------
         The table
         ------------------------------------------------------------------------ */

      function runRow(run) {
        const summary = buildSummary(run);
        const actions = [
          h("button", {
            type: "button",
            class: "btn btn-quiet btn-sm",
            text: "Logs",
            onclick: () => openLogs(run),
          }),
        ];
        if (CONFIG.canMutate) {
          actions.push(
            h("button", {
              type: "button",
              class: "btn btn-quiet btn-sm",
              text: "Delete",
              title: "Delete this Job and its pod",
              onclick: () => confirmDelete(run),
            }),
          );
        }

        const stateParts = [stateLabel(run.state)];
        if (run.stateReason && run.stateReason !== "Active") {
          stateParts.push(h("span", { class: "state-reason", text: run.stateReason }));
        }
        if (run.stateMessage) {
          // Clamped to two lines by the stylesheet, so the full text - which for a
          // blocked run is the scheduler's whole explanation - goes in the title.
          stateParts.push(
            h("span", { class: "state-reason", text: run.stateMessage, title: run.stateMessage }),
          );
        }

        return h(
          "tr",
          {},
          h(
            "td",
            {},
            h("code", { class: "run-name", title: run.name, text: run.name }),
            h("span", {
              class: "run-sub",
              text: `${run.manual ? "manual" : "scheduled"}${summary ? ` · ${summary}` : ""}`,
            }),
          ),
          h(
            "td",
            { class: "run-project" },
            run.project || "—",
            run.cronjob && run.cronjob !== run.project ? h("code", { text: run.cronjob }) : null,
          ),
          h("td", { class: "cell-state" }, stateParts),
          h(
            "td",
            { class: "num cell-started", title: formatAbsolute(run.startTime || run.createdAt) },
            formatRelative(run.startTime || run.createdAt),
          ),
          h("td", { class: "num cell-took", text: formatDuration(run.durationSeconds) }),
          h("td", {}, h("div", { class: "cell-actions" }, actions)),
        );
      }

      function renderRuns(snapshot) {
        const rows = $("run-rows");
        const all = snapshot.runs || [];
        const shown = all.filter(runMatchesFilters);

        $("run-count").textContent = String(all.length);
        $("runs-hint").textContent =
          shown.length === all.length ? "" : `showing ${shown.length} of ${all.length}`;

        if (!shown.length) {
          const message = all.length
            ? "No run matches the filters above."
            : "No runs yet. Start one from the Build page.";
          fill(rows, h("tr", { class: "row-empty" }, h("td", { colspan: "6", text: message })));
          return;
        }

        fill(rows, shown.map(runRow));
      }

      function syncProjectFilter(snapshot) {
        const names = new Set();
        for (const run of snapshot.runs || []) {
          if (run.cronjob) names.add(run.cronjob);
        }
        if (view.projectFilter !== "all") names.add(view.projectFilter);

        const options = [h("option", { value: "all", text: "Any project" })];
        for (const name of [...names].sort()) {
          options.push(h("option", { value: name, text: name }));
        }
        const select = $("project-filter");
        fill(select, options);
        select.value = names.has(view.projectFilter) ? view.projectFilter : "all";
        view.projectFilter = select.value;
      }

      function render(snapshot) {
        syncProjectFilter(snapshot);
        renderRuns(snapshot);
        if (logs.job) refreshLogs({ silent: true });
      }

      /* ------------------------------------------------------------------------
         The log viewer
         ------------------------------------------------------------------------ */

      const logs = {
        job: null,
        container: "",
        follow: true,
        timer: null,
      };

      function containerChoices(run) {
        const choices = [];
        for (const name of run.initContainers || []) {
          choices.push({ name, kind: "init" });
        }
        for (const name of run.containers || []) {
          choices.push({ name, kind: "main" });
        }
        return choices;
      }

      function populateContainerSelect(run) {
        const select = $("logs-container");
        const choices = containerChoices(run);
        logs.container = run.defaultContainer || (choices.length ? choices[choices.length - 1].name : "");

        fill(
          select,
          choices.map((choice) =>
            h("option", {
              value: choice.name,
              text: choice.kind === "init" ? `${choice.name} (init)` : choice.name,
            }),
          ),
        );
        select.value = logs.container;
        select.disabled = choices.length < 2;
      }

      function logFollowLabel() {
        $("logs-follow").setAttribute("aria-pressed", String(logs.follow));
        $("logs-follow").textContent = logs.follow ? "Following" : "Follow";
      }

      function writeLogText(text) {
        const output = $("logs-output");
        const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
        const unchanged = output.textContent === text;
        if (!unchanged) output.textContent = text;
        if (logs.follow && (atBottom || unchanged)) {
          output.scrollTop = output.scrollHeight;
        }
      }

      async function refreshLogs({ silent = false } = {}) {
        if (!logs.job) return;
        const params = new URLSearchParams({ tail: String(CONFIG.logTail) });
        if (logs.container) params.set("container", logs.container);

        try {
          const data = await api(`/api/runs/${encodeURIComponent(logs.job)}/logs?${params.toString()}`);
          if (logs.job !== data.job) return; // the dialog moved on while we waited

          const body = data.logs || "";
          const note = data.note || "";
          writeLogText(body || note || "No output yet.");

          const metaParts = [];
          if (data.pod) metaParts.push(`pod ${data.pod}`);
          if (data.container) metaParts.push(`container ${data.container}`);
          if (note && body) metaParts.push(note);
          $("logs-meta").textContent = metaParts.join(" · ");
        } catch (error) {
          if (!silent) writeLogText(`Could not read the log: ${error.message}`);
          $("logs-meta").textContent = error.message;
        }
      }

      async function openLogs(run) {
        logs.job = run.name;
        logs.follow = true;
        logFollowLabel();
        $("logs-title").textContent = `Logs · ${run.project || run.name}`;
        $("logs-sub").textContent = run.name;
        $("logs-open").href = `/api/runs/${encodeURIComponent(run.name)}/logs?tail=${CONFIG.logTail}`;
        $("logs-open").hidden = false;
        $("logs-output").textContent = "loading…";

        populateContainerSelect(run);
        $("logs-dialog").showModal();
        await refreshLogs({ silent: false });

        if (logs.timer) clearInterval(logs.timer);
        logs.timer = setInterval(() => {
          if (!document.hidden) refreshLogs({ silent: true });
        }, 3000);
      }

      function closeLogs() {
        if (logs.timer) {
          clearInterval(logs.timer);
          logs.timer = null;
        }
        logs.job = null;
        logs.container = "";
        const dialog = $("logs-dialog");
        if (dialog.open) dialog.close();
      }

      /* ------------------------------------------------------------------------
         Confirmation and delete
         ------------------------------------------------------------------------ */

      let confirmHandler = null;

      function askConfirm(title, message, okLabel) {
        return new Promise((resolve) => {
          $("confirm-title").textContent = title;
          $("confirm-text").textContent = message;
          $("confirm-ok").textContent = okLabel;
          confirmHandler = resolve;
          $("confirm-dialog").showModal();
        });
      }

      function settleConfirm(answer) {
        const resolve = confirmHandler;
        confirmHandler = null;
        $("confirm-dialog").close();
        if (resolve) resolve(answer);
      }

      async function confirmDelete(run) {
        const agreed = await askConfirm(
          "Delete this run?",
          `Job ${run.name} and its pod are removed. A build that is still going is stopped, and the ` +
            "history for this run is gone. The image it was building is not affected.",
          "Delete run",
        );
        if (!agreed) return;
        try {
          await api(`/api/runs/${encodeURIComponent(run.name)}`, { method: "DELETE" });
          toast(`Deleted ${run.name}`, "success");
          if (logs.job === run.name) closeLogs();
          await refresh();
        } catch (error) {
          toast(`Could not delete the run: ${error.message}`, "error");
        }
      }

      /* ------------------------------------------------------------------------
         Wiring
         ------------------------------------------------------------------------ */

      function wire() {
        $("run-filter").addEventListener("change", (event) => {
          view.runFilter = event.target.value;
          writeFiltersToUrl();
          const snapshot = current();
          if (snapshot) renderRuns(snapshot);
        });

        $("project-filter").addEventListener("change", (event) => {
          view.projectFilter = event.target.value;
          writeFiltersToUrl();
          const snapshot = current();
          if (snapshot) renderRuns(snapshot);
        });

        $("logs-close").addEventListener("click", closeLogs);

        $("logs-container").addEventListener("change", (event) => {
          logs.container = event.target.value;
          $("logs-output").textContent = "loading…";
          refreshLogs({ silent: false });
        });

        $("logs-follow").addEventListener("click", () => {
          logs.follow = !logs.follow;
          logFollowLabel();
          if (logs.follow) {
            const output = $("logs-output");
            output.scrollTop = output.scrollHeight;
          }
        });

        $("logs-output").addEventListener("scroll", (event) => {
          const output = event.currentTarget;
          const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
          // Scrolling up is how a person says "stop moving the text".
          if (!atBottom && logs.follow) {
            logs.follow = false;
            logFollowLabel();
          }
        });

        $("confirm-cancel").addEventListener("click", () => settleConfirm(false));
        $("confirm-ok").addEventListener("click", () => settleConfirm(true));
        $("confirm-dialog").addEventListener("cancel", (event) => {
          event.preventDefault();
          settleConfirm(false);
        });
        $("confirm-dialog").addEventListener("click", (event) => {
          if (event.target === $("confirm-dialog")) settleConfirm(false);
        });

        $("logs-dialog").addEventListener("cancel", (event) => {
          event.preventDefault();
          closeLogs();
        });
        $("logs-dialog").addEventListener("click", (event) => {
          if (event.target === $("logs-dialog")) closeLogs();
        });
      }

      readFiltersFromUrl();
      $("run-filter").value = view.runFilter;
      logFollowLabel();
      wire();
      onSnapshot(render);
      start();
    })();
  static.style.css: |
    /* ==========================================================================
       Image Builder — operation console for the Packer build CronJobs.
       One accent colour, semantic state colours, flat surfaces. Light by default,
       dark when the operating system asks for it, on the same token names.
       ========================================================================== */

    *,
    *::before,
    *::after { box-sizing: border-box; }

    :root {
      /* Surfaces */
      --surface: #ffffff;
      --surface-sunken: #f6f7f9;
      --surface-raised: #ffffff;
      --line: #e3e6ea;
      --line-strong: #cfd5dc;

      /* Text */
      --ink: #16191d;
      --ink-soft: #515a66;
      --ink-faint: #79838f;

      /* Accent */
      --accent: #2462e0;
      --accent-ink: #ffffff;
      --accent-soft: #eaf0fd;
      --accent-line: #b9cdf8;

      /* State */
      --ok: #12805c;
      --ok-soft: #e4f5ee;
      --ok-line: #a8ddc9;
      --warn: #9a6206;
      --warn-soft: #fdf3e2;
      --warn-line: #f0d7a6;
      --bad: #b42318;
      --bad-soft: #fdecea;
      --bad-line: #f3c3be;
      --info: #1c5fb0;
      --info-soft: #e8f1fc;
      --info-line: #bcd6f4;
      --idle: #5b6472;
      --idle-soft: #eef0f3;
      --idle-line: #d8dce2;

      /* Shape */
      --radius: 10px;
      --radius-sm: 6px;
      --radius-pill: 999px;
      --shadow: 0 1px 2px rgba(16, 20, 26, .06), 0 1px 1px rgba(16, 20, 26, .04);
      --shadow-lift: 0 6px 20px rgba(16, 20, 26, .10), 0 2px 6px rgba(16, 20, 26, .06);

      /* Type */
      --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-code: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

      /* Layout */
      --page-max: 1280px;
      --gap: 20px;
    }

    /* --------------------------------------------------------------------------
       Terminal theme, after k9s.

       Pure black like a terminal rather than a dark grey, the ANSI colour set the
       terminal itself would give you, square corners, and monospace for everything
       including the interface. This is what `data-theme="dark"` selects; `auto`
       resolves to it when the operating system asks for dark (see core.js).

       The colour assignments follow k9s: cyan for headings and chrome, green for
       success and for the numbers you are looking at, yellow for anything paused or
       nearing a limit, red for failure, and grey for everything that is only
       context.
       -------------------------------------------------------------------------- */

    :root[data-theme="dark"] {
      color-scheme: dark;

      --surface: #000000;
      --surface-sunken: #000000;
      --surface-raised: #0b0b0b;
      --line: #262626;
      --line-strong: #3b3b3b;

      --ink: #e4e4e4;
      --ink-soft: #c2c2c2;
      --ink-faint: #8a8a8a;

      --accent: #00d7d7;
      --accent-ink: #000000;
      --accent-soft: #002b2b;
      --accent-line: #0d5f5f;

      --ok: #00d787;
      --ok-soft: #00251a;
      --ok-line: #0a6b45;
      --warn: #ffd75f;
      --warn-soft: #2b2300;
      --warn-line: #6b5a0a;
      --bad: #ff5f5f;
      --bad-soft: #2b0d0d;
      --bad-line: #7a2020;
      --info: #5f87ff;
      --info-soft: #0d1730;
      --info-line: #2b4270;
      --idle: #9a9a9a;
      --idle-soft: #141414;
      --idle-line: #333333;

      /* A terminal has no drop shadows and no rounded corners. */
      --radius: 2px;
      --radius-sm: 2px;
      --shadow: none;
      --shadow-lift: 0 0 0 1px var(--line-strong);

      /* Monospace throughout, which is what makes it read as a console rather
         than a dark web page. */
      --font-ui: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    }

    /* The chrome is cyan in a terminal, and the headings are the chrome. */
    :root[data-theme="dark"] .section-heading { color: var(--accent); }
    :root[data-theme="dark"] .brand-mark {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: var(--radius-sm);
    }
    :root[data-theme="dark"] .brand-title { color: var(--ink); letter-spacing: .01em; }
    :root[data-theme="dark"] .mainnav a[aria-current="page"] {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent);
    }
    :root[data-theme="dark"] .runs-table thead th { color: var(--accent); background: #0b0b0b; }
    :root[data-theme="dark"] .project-card:hover { border-color: var(--accent-line); }
    :root[data-theme="dark"] .capacity-card,
    :root[data-theme="dark"] .project-card,
    :root[data-theme="dark"] .table-scroll { border-color: var(--line); }
    :root[data-theme="dark"] .log-output {
      background: #000000;
      border-color: var(--line);
      color: #cfd6cf;
    }
    /* Chips and count pills sit on --surface-sunken, which is pure black here, so
       they need the raised surface to be visible at all. Deliberately not touching
       .btn: a blanket background here would outrank .btn-primary and .btn-danger
       and paint the accent fills black. */
    :root[data-theme="dark"] .count-pill,
    :root[data-theme="dark"] .chip { background: var(--surface-raised); }
    :root[data-theme="dark"] dialog::backdrop { background: rgba(0, 0, 0, .75); }

    html { -webkit-text-size-adjust: 100%; color-scheme: light; }

    body {
      margin: 0;
      background: var(--surface-sunken);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1, h2, h3, p { margin: 0; }
    code { font-family: var(--font-code); font-size: .92em; }

    :where(a) { color: var(--accent); }

    :where(button, select, a, pre):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -48px;
      z-index: 50;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-ink);
      text-decoration: none;
      font-weight: 600;
      transition: top .12s ease;
    }
    .skip-link:focus { top: 12px; }

    /* --------------------------------------------------------------------------
       Top bar
       -------------------------------------------------------------------------- */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    /* The brand is the way home from every page, so it is a link - but not one
       that looks like body copy. */
    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .brand-text { display: flex; flex-direction: column; min-width: 0; }
    .brand-title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .brand-sub { font-size: 12px; color: var(--ink-faint); }
    .brand-sub code { color: var(--ink-soft); }

    /* --------------------------------------------------------------------------
       Section navigation

       Three pages, so the navigation is three links rather than a menu. The
       current one is marked, and marked for a screen reader too: colour alone is
       not a state.
       -------------------------------------------------------------------------- */

    .mainnav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mainnav a {
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color .12s ease, color .12s ease, border-color .12s ease;
    }
    .mainnav a:hover { background: var(--surface-sunken); color: var(--ink); }
    .mainnav a[aria-current="page"] {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* --------------------------------------------------------------------------
       Connection indicator
       -------------------------------------------------------------------------- */

    .conn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface-raised);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--idle);
      box-shadow: 0 0 0 3px var(--idle-soft);
    }
    .conn-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .conn[data-state="connected"] { color: var(--ok); border-color: var(--ok-line); }
    .conn[data-state="connected"] .conn-dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
    .conn[data-state="unavailable"] { color: var(--bad); border-color: var(--bad-line); }
    .conn[data-state="unavailable"] .conn-dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
    .conn[data-state="connecting"] { color: var(--warn); border-color: var(--warn-line); }
    .conn[data-state="connecting"] .conn-dot {
      background: var(--warn);
      box-shadow: 0 0 0 3px var(--warn-soft);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .conn[data-state="connecting"] .conn-dot { animation: none; }
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

    /* --------------------------------------------------------------------------
       Buttons, badges, fields
       -------------------------------------------------------------------------- */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-raised);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 550;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-sunken); border-color: var(--ink-faint); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .btn-primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent) 88%, black);
      border-color: color-mix(in srgb, var(--accent) 88%, black);
    }

    .btn-quiet { background: transparent; border-color: var(--line); color: var(--ink-soft); }
    .btn-quiet:hover:not(:disabled) { background: var(--surface-sunken); color: var(--ink); }

    .btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
    .btn-danger:hover:not(:disabled) {
      background: color-mix(in srgb, var(--bad) 85%, black);
      border-color: color-mix(in srgb, var(--bad) 85%, black);
    }

    .btn-sm { padding: 4px 9px; font-size: 12px; }
    .btn-icon { padding: 6px; }

    /* The theme toggle shows one of three icons. `hidden` is an HTML attribute and
       has no effect on an SVG element, so it is honoured explicitly here. */
    .theme-icon { display: block; }
    .theme-icon[hidden] { display: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border: 1px solid var(--idle-line);
      border-radius: var(--radius-pill);
      background: var(--idle-soft);
      color: var(--idle);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .badge-readonly { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }

    .field { display: inline-flex; align-items: center; gap: 7px; }
    .field-inline { gap: 5px; }
    .field-label {
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    select {
      font: inherit;
      font-size: 13px;
      padding: 5px 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-raised);
      color: var(--ink);
      cursor: pointer;
      max-width: 100%;
    }

    .muted { color: var(--ink-faint); }
    .centre { text-align: center; }

    /* --------------------------------------------------------------------------
       Page frame
       -------------------------------------------------------------------------- */

    main {
      flex: 1;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: var(--gap) 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--ink-soft);
    }

    .section-note {
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink-faint);
    }
    .section-note em { font-style: normal; font-weight: 600; color: var(--warn); }

    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 19px;
      padding: 0 7px;
      border-radius: var(--radius-pill);
      background: var(--idle-soft);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .page-foot {
      padding: 14px 24px 22px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
    }
    .page-foot code { color: var(--ink-soft); }

    /* A line of orientation under a page heading. */
    .page-lede {
      max-width: 76ch;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .page-lede strong { color: var(--ink); }
    .page-lede code { color: var(--ink); }

    /* A "see all" link that sits in a section heading. */
    .section-link {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      text-decoration: none;
      white-space: nowrap;
    }
    .section-link:hover { text-decoration: underline; }

    /* --------------------------------------------------------------------------
       At a glance
       -------------------------------------------------------------------------- */

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .stat-card {
      padding: 12px 14px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
    }

    .stat-value {
      margin: 4px 0 2px;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .stat-note {
      font-size: 11.5px;
      color: var(--ink-faint);
      overflow-wrap: anywhere;
    }

    /* --------------------------------------------------------------------------
       Needs attention
       -------------------------------------------------------------------------- */

    .attention-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .attention-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--idle);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .attention-item[data-tone="bad"] { border-left-color: var(--bad); border-color: var(--bad-line); }
    .attention-item[data-tone="warn"] { border-left-color: var(--warn); border-color: var(--warn-line); }

    .attention-dot {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--idle);
    }
    .attention-item[data-tone="bad"] .attention-dot { background: var(--bad); }
    .attention-item[data-tone="warn"] .attention-dot { background: var(--warn); }

    .attention-body { flex: 1; min-width: 0; }
    .attention-title { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .attention-detail {
      margin-top: 2px;
      font-size: 12px;
      color: var(--ink-faint);
      overflow-wrap: anywhere;
    }

    .attention-link {
      flex: 0 0 auto;
      align-self: center;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .attention-link:hover { text-decoration: underline; }

    /* --------------------------------------------------------------------------
       Banner (an error worth more than a toast)
       -------------------------------------------------------------------------- */

    .banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--bad-line);
      border-left: 3px solid var(--bad);
      border-radius: var(--radius-sm);
      background: var(--bad-soft);
      color: var(--bad);
      font-size: 13px;
    }
    .banner[hidden] { display: none; }
    .banner-text { flex: 1; overflow-wrap: anywhere; }
    .banner-close {
      border: 0;
      background: none;
      color: inherit;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      opacity: .7;
    }
    .banner-close:hover { opacity: 1; }

    /* --------------------------------------------------------------------------
       Capacity
       -------------------------------------------------------------------------- */

    .capacity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .capacity-card {
      padding: 12px 14px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .capacity-card[data-saturated="true"] {
      border-color: var(--warn-line);
      background: var(--warn-soft);
    }

    .capacity-label {
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
    }
    .capacity-card[data-saturated="true"] .capacity-label { color: var(--warn); }

    .capacity-value {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 4px 0 8px;
      font-variant-numeric: tabular-nums;
    }
    .capacity-used { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
    .capacity-hard { font-size: 12px; color: var(--ink-faint); }

    .capacity-track {
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--idle-soft);
      overflow: hidden;
    }
    .capacity-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s ease;
    }
    .capacity-card[data-saturated="true"] .capacity-fill { background: var(--warn); }

    /* --------------------------------------------------------------------------
       Project cards
       -------------------------------------------------------------------------- */

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: box-shadow .14s ease, border-color .14s ease;
    }
    .project-card:hover { box-shadow: var(--shadow-lift); border-color: var(--line-strong); }
    .project-card[data-health="failing"] { border-left: 3px solid var(--bad); }
    .project-card[data-health="running"] { border-left: 3px solid var(--info); }
    .project-card[data-health="suspended"] { border-left: 3px solid var(--warn); }
    .project-card[data-health="ok"] { border-left: 3px solid var(--ok); }
    .project-card[data-health="orphan"] { border-left: 3px solid var(--idle); }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
    }
    .card-name {
      display: block;
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--ink-faint);
      overflow-wrap: anywhere;
    }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--idle-line);
      background: var(--idle-soft);
      color: var(--idle);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .health-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .health[data-health="ok"] { border-color: var(--ok-line); background: var(--ok-soft); color: var(--ok); }
    .health[data-health="failing"] { border-color: var(--bad-line); background: var(--bad-soft); color: var(--bad); }
    .health[data-health="running"] { border-color: var(--info-line); background: var(--info-soft); color: var(--info); }
    .health[data-health="suspended"] { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
    .health[data-health="never"] { border-color: var(--idle-line); background: var(--idle-soft); color: var(--idle); }
    .health[data-health="orphan"] { border-color: var(--idle-line); background: var(--idle-soft); color: var(--idle); }

    .card-purpose {
      font-size: 12.5px;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-sunken);
      color: var(--ink-soft);
      font-size: 11.5px;
      overflow-wrap: anywhere;
    }
    .chip-key { color: var(--ink-faint); }
    .chip code { font-size: 11px; color: var(--ink); }

    .card-run {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-faint);
    }
    .card-run .state-label { font-size: 11px; }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .card-actions .btn-primary { flex: 1 1 auto; }

    .card-note {
      font-size: 11.5px;
      color: var(--warn);
      overflow-wrap: anywhere;
    }

    /* --------------------------------------------------------------------------
       Runs
       -------------------------------------------------------------------------- */

    .runs-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .runs-hint { font-size: 12px; color: var(--ink-faint); }

    .table-scroll {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    .runs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .runs-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 9px 14px;
      text-align: left;
      white-space: nowrap;
      background: var(--surface-sunken);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
    }

    .runs-table tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .runs-table tbody tr:last-child td { border-bottom: 0; }
    .runs-table tbody tr:hover { background: var(--surface-sunken); }

    .runs-table .col-actions { text-align: right; }
    .cell-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

    .run-name {
      display: block;
      max-width: 330px;
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .run-sub {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--ink-faint);
    }
    .run-project { font-weight: 550; overflow-wrap: anywhere; }
    .run-project code { font-size: 11px; color: var(--ink-faint); display: block; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* State label: the single place a run's outcome is coloured. */
    .state-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border: 1px solid var(--idle-line);
      border-radius: var(--radius-pill);
      background: var(--idle-soft);
      color: var(--idle);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .02em;
      white-space: nowrap;
      text-transform: capitalize;
    }
    .state-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }
    .state-label[data-state="succeeded"] { border-color: var(--ok-line); background: var(--ok-soft); color: var(--ok); }
    .state-label[data-state="failed"] { border-color: var(--bad-line); background: var(--bad-soft); color: var(--bad); }
    .state-label[data-state="running"] { border-color: var(--info-line); background: var(--info-soft); color: var(--info); }
    .state-label[data-state="blocked"] { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
    .state-label[data-state="pending"] { border-color: var(--idle-line); background: var(--idle-soft); color: var(--idle); }

    .state-reason {
      /* A scheduler message can run to five lines ("0/1 nodes are available: 1
         Insufficient cpu. preemption: ..."), which makes one row four times the
         height of its neighbours and pushes the table off the screen. Two lines is
         enough to tell two failures apart; the full text is in the title. */
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 260px;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.35;
      color: var(--ink-faint);
      overflow-wrap: anywhere;
    }

    .row-empty td {
      padding: 34px 14px;
      text-align: center;
      color: var(--ink-faint);
      font-size: 13px;
    }

    /* --------------------------------------------------------------------------
       Dialogs
       -------------------------------------------------------------------------- */

    dialog {
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-lift);
    }
    dialog::backdrop { background: rgba(12, 16, 22, .55); }

    .logs-dialog {
      width: min(1080px, 94vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .logs-dialog:not([open]) { display: none; }

    .logs-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-sunken);
    }
    .logs-head h2 { font-size: 14px; font-weight: 650; }
    /* A long Job name must wrap rather than push the controls out of the header. */
    .logs-head-text { min-width: 0; }
    .logs-sub { font-size: 11.5px; color: var(--ink-faint); overflow-wrap: anywhere; }
    .logs-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .logs-body { flex: 1; min-height: 0; padding: 14px 16px; overflow: hidden; }

    .log-output {
      height: 100%;
      max-height: 58vh;
      margin: 0;
      padding: 13px 15px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #0c1117;
      color: #d7e0ea;
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 4;
    }

    .logs-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 16px;
      border-top: 1px solid var(--line);
      background: var(--surface-sunken);
      font-size: 11.5px;
      color: var(--ink-faint);
    }
    .logs-meta { overflow-wrap: anywhere; }
    .logs-link { color: var(--accent); }

    .confirm-dialog {
      width: min(440px, 92vw);
      padding: 20px;
    }
    .confirm-dialog h2 { font-size: 15px; font-weight: 650; margin-bottom: 8px; }
    .confirm-dialog p { font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    /* --------------------------------------------------------------------------
       Toasts
       -------------------------------------------------------------------------- */

    .toasts {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(420px, calc(100vw - 36px));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px 13px;
      border: 1px solid var(--line-strong);
      border-left: 3px solid var(--idle);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-lift);
      font-size: 13px;
      pointer-events: auto;
      animation: toast-in .16s ease-out;
    }
    .toast-text { overflow-wrap: anywhere; }
    .toast[data-kind="success"] { border-left-color: var(--ok); }
    .toast[data-kind="error"] { border-left-color: var(--bad); }
    .toast[data-kind="info"] { border-left-color: var(--info); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    /* --------------------------------------------------------------------------
       Narrow screens
       -------------------------------------------------------------------------- */

    @media (max-width: 860px) {
      .topbar { padding: 10px 14px; }
      main { padding: 14px 14px 32px; gap: 22px; }
      .project-grid { grid-template-columns: 1fr; }
      .run-name { max-width: 180px; }
    }

    @media (max-width: 620px) {
      /* The brand, the three links and the two buttons do not fit on one line at
         this width, and a flex row that overflows simply clips the last link. The
         navigation takes its own row instead, split evenly so each target is a
         full thumb. */
      .topbar { padding: 10px 12px; gap: 10px; }
      .brand { flex: 1 1 100%; order: 1; }
      .brand-sub { display: none; }
      .mainnav { order: 2; width: 100%; gap: 6px; }
      .mainnav a {
        flex: 1 1 0;
        padding: 9px 5px;
        text-align: center;
        font-size: 12px;
      }
      /* The actions go under the navigation: a person reaches for a link more
         often than for Refresh, and the row has to end somewhere. */
      .topbar-actions { order: 3; margin-left: auto; }

      .runs-toolbar { gap: 10px; }
      .field { width: 100%; }
      .field select { flex: 1; }

      /* One run per card. The header row is gone, so the two bare numbers would be
         unlabelled: they keep a label of their own and share a line. */
      .runs-table thead { display: none; }
      .runs-table tbody tr {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .runs-table tbody td {
        padding: 0;
        border: 0;
        grid-column: 1 / -1;
      }
      .runs-table tbody td.cell-started,
      .runs-table tbody td.cell-took { grid-column: auto; }
      .runs-table tbody td.cell-started::before,
      .runs-table tbody td.cell-took::before,
      .runs-table tbody td.run-project::before {
        display: block;
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--ink-faint);
      }
      .runs-table tbody td.cell-started::before { content: "started"; }
      .runs-table tbody td.cell-took::before { content: "took"; }
      /* The project usually reads exactly like the start of the Job name, so
         without a label the second line looks like a mistake. */
      .runs-table tbody td.run-project::before { content: "project"; }
      .cell-actions { justify-content: flex-start; }
      .run-name { max-width: 100%; white-space: normal; }
      .state-reason { max-width: 100%; }
      .logs-dialog { width: 96vw; max-height: 90vh; }
      .log-output { max-height: 52vh; }
    }
  templates.base.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light dark">
      <title>{{ page_title }} &middot; Image Builder &middot; {{ namespace }}</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232462e0'/><path d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">
      <script>
        /* Resolve the theme before the first paint. Inline and in the head on
           purpose: doing this from a script at the end of the body means one frame
           of the wrong theme on every load, which is the flicker people notice.

           The stored preference is "auto", "light" or "dark"; "auto" follows the
           operating system. The resolved value goes to data-theme, which is what
           the stylesheet keys off, and the raw preference to data-theme-mode, which
           is what the toggle's label reflects. */
        (function () {
          var stored = null;
          try { stored = window.localStorage.getItem('aria-image-builder-theme'); } catch (e) { stored = null; }
          var mode = (stored === 'light' || stored === 'dark') ? stored : 'auto';

          /* ?theme=dark or ?theme=light forces one theme for this page view
             without writing the preference, so a screenshot or a link to the
             terminal view is reproducible without touching the browser. */
          var forced = null;
          try { forced = new URLSearchParams(window.location.search).get('theme'); } catch (e) { forced = null; }
          if (forced === 'dark' || forced === 'light' || forced === 'auto') mode = forced;

          var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var dark = mode === 'dark' || (mode === 'auto' && prefersDark);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme-mode', mode);
        })();
      </script>
    </head>
    <body data-page="{{ page }}"
          data-refresh-seconds="{{ refresh_seconds }}"
          data-can-mutate="{{ 'true' if can_mutate else 'false' }}"
          data-log-tail="{{ log_tail }}">

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="brand">
        <a class="brand-link" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h10"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">Image Builder</span>
            <span class="brand-sub">Packer image builds &middot; namespace <code>{{ namespace }}</code></span>
          </span>
        </a>
      </div>

      <nav class="mainnav" aria-label="Sections">
        <a href="/"{% if page == "landing" %} aria-current="page"{% endif %}>Overview</a>
        <a href="/build"{% if page == "build" %} aria-current="page"{% endif %}>Build</a>
        <a href="/runs"{% if page == "runs" %} aria-current="page"{% endif %}>Runs</a>
      </nav>

      <div class="topbar-actions">
        {% if not can_mutate %}
          <span class="badge badge-readonly" title="READ_ONLY is set: viewing only">
            read-only
          </span>
        {% endif %}
        <span class="conn" id="connection" data-state="unknown" role="status" aria-live="polite">
          <span class="conn-dot" aria-hidden="true"></span>
          <span class="conn-text">connecting</span>
        </span>

        <!-- Theme ----------------------------------------------------------
             Cycles auto -> dark -> light -> auto. The icons are swapped by
             core.js; this one is the "auto" state, which is what a fresh browser
             gets.
        ------------------------------------------------------------------ -->
        <button type="button" class="btn btn-quiet btn-icon" id="theme-button"
                data-mode="auto" title="Theme: follow the system" aria-label="Theme: follow the system">
          <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="8.2"/>
            <path d="M12 3.8v16.4" />
            <path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none"/>
          </svg>
          <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               aria-hidden="true" hidden>
            <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
          </svg>
          <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               aria-hidden="true" hidden>
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
          </svg>
        </button>

        <button type="button" class="btn btn-quiet" id="refresh-button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <main id="main">

      <div class="banner" id="banner" hidden role="alert">
        <span class="banner-text" id="banner-text"></span>
        <button type="button" class="banner-close" id="banner-close" aria-label="Dismiss">&times;</button>
      </div>

      {% block content %}{% endblock %}

    </main>

    <footer class="page-foot">
      <p>
        <span id="foot-namespace">{{ namespace }}</span>
        &middot; every <span id="foot-refresh">{{ refresh_seconds }}</span>s
        &middot; <span id="foot-updated">never</span>
      </p>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="{{ url_for('static', filename='core.js') }}" defer></script>
    <script src="{{ url_for('static', filename=page_script) }}" defer></script>
    </body>
    </html>
  templates.build.html: |
    {% extends "base.html" %}

    {% block content %}

      <section aria-labelledby="projects-heading">
        <h2 class="section-heading" id="projects-heading">
          Build projects
          <span class="count-pill" id="project-count">0</span>
          <span class="section-note">start a run now, or pause the schedule</span>
        </h2>

        <p class="page-lede">
          Each card is one CronJob in <code>{{ namespace }}</code>. <strong>Build now</strong>
          creates a single Job from it, exactly as the schedule would, and does not change
          the schedule. <strong>Pause</strong> stops the schedule starting runs; a run already
          going carries on.
        </p>

        <div class="project-grid" id="project-grid">
          <p class="muted">loading&hellip;</p>
        </div>
      </section>

    {% endblock %}
  templates.landing.html: |
    {% extends "base.html" %}

    {% block content %}

      <!-- At a glance ------------------------------------------------------- -->
      <section aria-labelledby="summary-heading">
        <h2 class="section-heading" id="summary-heading">
          At a glance
          <span class="section-note">one read of the namespace, on every refresh</span>
        </h2>
        <div class="stat-grid" id="stat-grid">
          <p class="muted">loading&hellip;</p>
        </div>
      </section>

      <!-- Capacity ---------------------------------------------------------- -->
      <section class="capacity" aria-labelledby="capacity-heading">
        <h2 class="section-heading" id="capacity-heading">
          Namespace capacity
          <span class="section-note">a build that cannot get a pod stays <em>blocked</em></span>
        </h2>
        <div class="capacity-grid" id="capacity-grid">
          <p class="muted">loading&hellip;</p>
        </div>
      </section>

      <!-- Needs attention --------------------------------------------------- -->
      <section aria-labelledby="attention-heading">
        <h2 class="section-heading" id="attention-heading">
          Needs attention
          <span class="count-pill" id="attention-count">0</span>
          <span class="section-note">paused, failing, or stuck without a pod</span>
        </h2>
        <div class="attention-list" id="attention-list">
          <p class="muted">loading&hellip;</p>
        </div>
      </section>

      <!-- Latest runs ------------------------------------------------------- -->
      <section aria-labelledby="recent-heading">
        <h2 class="section-heading" id="recent-heading">
          Latest runs
          <a class="section-link" href="/runs">All runs</a>
        </h2>
        <div class="table-scroll">
          <table class="runs-table">
            <caption class="visually-hidden">The five most recent build runs</caption>
            <thead>
              <tr>
                <th scope="col">Run</th>
                <th scope="col">Project</th>
                <th scope="col">State</th>
                <th scope="col">Started</th>
                <th scope="col">Took</th>
              </tr>
            </thead>
            <tbody id="recent-rows">
              <tr><td colspan="5" class="muted centre">loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    {% endblock %}
  templates.runs.html: |
    {% extends "base.html" %}

    {% block content %}

      <section aria-labelledby="runs-heading">
        <h2 class="section-heading" id="runs-heading">
          Runs
          <span class="count-pill" id="run-count">0</span>
          <span class="section-note">every Job in <code>{{ namespace }}</code>, newest first</span>
        </h2>

        <div class="runs-toolbar">
          <label class="field">
            <span class="field-label">Show</span>
            <select id="run-filter">
              <option value="all">All runs</option>
              <option value="active">Active only</option>
              <option value="failed">Failed only</option>
              <option value="succeeded">Succeeded only</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Project</span>
            <select id="project-filter">
              <option value="all">Any project</option>
            </select>
          </label>
          <p class="runs-hint" id="runs-hint"></p>
        </div>

        <div class="table-scroll">
          <table class="runs-table">
            <caption class="visually-hidden">Packer build runs, newest first</caption>
            <thead>
              <tr>
                <th scope="col">Run</th>
                <th scope="col">Project</th>
                <th scope="col">State</th>
                <th scope="col">Started</th>
                <th scope="col">Took</th>
                <th scope="col" class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="run-rows">
              <tr><td colspan="6" class="muted centre">loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Log viewer -------------------------------------------------------- -->
      <dialog class="logs-dialog" id="logs-dialog" aria-labelledby="logs-title">
        <div class="logs-head">
          <div class="logs-head-text">
            <h2 id="logs-title">Logs</h2>
            <p class="logs-sub" id="logs-sub">&mdash;</p>
          </div>
          <div class="logs-head-actions">
            <label class="field field-inline">
              <span class="field-label">Container</span>
              <select id="logs-container"></select>
            </label>
            <button type="button" class="btn btn-quiet btn-sm" id="logs-follow" aria-pressed="true">
              Follow
            </button>
            <button type="button" class="btn btn-quiet btn-sm" id="logs-close" aria-label="Close logs">
              &times;
            </button>
          </div>
        </div>
        <div class="logs-body">
          <pre class="log-output" id="logs-output" tabindex="0">loading&hellip;</pre>
        </div>
        <div class="logs-foot">
          <span class="logs-meta" id="logs-meta"></span>
          <a class="logs-link" id="logs-open" href="#" hidden>open in new tab</a>
        </div>
      </dialog>

      <!-- Confirmation ------------------------------------------------------ -->
      <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-quiet" id="confirm-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
      </dialog>

    {% endblock %}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aria-image-builder-web
  namespace: packer-frontend
  labels:
    app.kubernetes.io/name: aria-image-builder-web
    app.kubernetes.io/part-of: aria-automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aria-image-builder-web
  namespace: packer-imaging
  labels:
    app.kubernetes.io/name: aria-image-builder-web
    app.kubernetes.io/part-of: aria-automation
  annotations:
    aria-automation/purpose: >-
      Lets the image builder front end in packer-frontend read and control the
      build CronJobs in this namespace.
rules:
  # The build definitions: read them, and pause or resume their schedules.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch"]
  # Runs: read them, start one, delete a finished one.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Pods are read to explain a run: why it is not starting, and which
  # container to read the log from.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The capacity bars.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aria-image-builder-web
  namespace: packer-imaging
  labels:
    app.kubernetes.io/name: aria-image-builder-web
    app.kubernetes.io/part-of: aria-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aria-image-builder-web
subjects:
# The subject lives in the other namespace: the pod runs in packer-frontend
  # and is authorised here.
  - kind: ServiceAccount
    name: aria-image-builder-web
    namespace: packer-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-image-builder-web
  namespace: packer-frontend
  labels:
    app.kubernetes.io/name: aria-image-builder-web
    app.kubernetes.io/part-of: aria-automation
    app.kubernetes.io/component: web
  annotations:
    aria-automation/purpose: Web front end for starting and rebuilding images
spec:
  replicas: 1
  # The node's port 80 can only be held by one pod: rolling a second one up
  # before the first goes down would leave it Pending for ever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aria-image-builder-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aria-image-builder-web
        app.kubernetes.io/part-of: aria-automation
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: aria-image-builder-web
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: python:3.14-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -f /deps/.installed ]; then
                echo "installing dependencies into /deps"
                pip install --quiet --no-cache-dir --target /deps \
                  -r /app/requirements.txt
                touch /deps/.installed
              fi
              exec python /app/app.py
          ports:
            - name: http
              containerPort: 8080
              # The node's own port 80, so the page is reachable at
              # http://10.3.48.245/ without a proxy or an ingress.
              hostPort: 80
              protocol: TCP
          env:
            # The namespace the page READS. This is not the namespace the pod
            # runs in: the builds are in packer-imaging, the app is here.
            - name: KUBE_NAMESPACE
              value: packer-imaging
            - name: FLASK_HOST
              value: "0.0.0.0"
            - name: FLASK_PORT
              value: "8080"
            - name: REFRESH_SECONDS
              value: "8"
            - name: LOG_TAIL_DEFAULT
              value: "2000"
            # Set to "1" to publish the page read-only: builds cannot be
            # started, runs cannot be deleted, schedules cannot be changed.
            - name: READ_ONLY
              value: "0"
            - name: PYTHONPATH
              value: /deps
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          configMap:
            name: aria-image-builder-web-app
            # The keys are flat because a ConfigMap key cannot contain a
            # slash; these entries put the subdirectories back, so Flask finds
            # templates/ and static/ where it expects them.
            items:
              - key: app.py
                path: app.py
              - key: api.py
                path: api.py
              - key: config.py
                path: config.py
              - key: k8stime.py
                path: k8stime.py
              - key: kube.py
                path: kube.py
              - key: naming.py
                path: naming.py
              - key: pages.py
                path: pages.py
              - key: projects.py
                path: projects.py
              - key: quantities.py
                path: quantities.py
              - key: runs.py
                path: runs.py
              - key: services.py
                path: services.py
              - key: requirements.txt
                path: requirements.txt
              - key: templates.base.html
                path: templates/base.html
              - key: templates.landing.html
                path: templates/landing.html
              - key: templates.build.html
                path: templates/build.html
              - key: templates.runs.html
                path: templates/runs.html
              - key: static.style.css
                path: static/style.css
              - key: static.core.js
                path: static/core.js
              - key: static.landing.js
                path: static/landing.js
              - key: static.build.js
                path: static/build.js
              - key: static.runs.js
                path: static/runs.js
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aria-image-builder-web
  namespace: packer-frontend
  labels:
    app.kubernetes.io/name: aria-image-builder-web
    app.kubernetes.io/part-of: aria-automation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aria-image-builder-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
