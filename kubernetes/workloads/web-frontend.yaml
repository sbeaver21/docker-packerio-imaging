    """Timestamps as the Kubernetes API writes them, and as the UI wants them.

    The API server emits RFC 3339 in UTC with a trailing ``Z`` and optional
    fractional seconds. Everything this front end parses comes from there, and
    everything it emits is the same shape so the browser can sort runs as strings
    when it needs to.

    Kept apart from the summary modules because both of them need it and neither
    should have to import the other to get it.
    """

    from __future__ import annotations

    from datetime import datetime, timezone
    from typing import Any


    def parse_timestamp(value: Any) -> datetime | None:
        """Parse an API timestamp, returning ``None`` for anything unreadable.

        ``None`` rather than an exception: a Job that has not started yet has no
        ``startTime``, and a malformed one is not a reason to fail the whole list
        response. The caller renders an em dash for an unknown time.
        """
        if not value or not isinstance(value, str):
            return None
        text = value.strip()
        if not text:
            return None
        # Python 3.11+ accepts a trailing Z directly, but the explicit replacement
        # keeps this working on the 3.9/3.10 interpreter an operator may have
        # locally.
        if text.endswith("Z"):
            text = f"{text[:-1]}+00:00"
        try:
            parsed = datetime.fromisoformat(text)
        except ValueError:
            return None
        if parsed.tzinfo is None:
            return parsed.replace(tzinfo=timezone.utc)
        return parsed.astimezone(timezone.utc)


    def format_timestamp(moment: datetime | None) -> str | None:
        """Render a moment the way the API does, or ``None``."""
        if moment is None:
            return None
        return moment.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def seconds_between(start: datetime | None, end: datetime | None) -> int | None:
        """Whole seconds from ``start`` to ``end``, or ``None`` if unknown."""
        if start is None or end is None:
            return None
        delta = (end - start).total_seconds()
        if delta < 0:
            return 0
        return int(delta)


    def elapsed_since(start: datetime | None, now: datetime | None = None) -> int | None:
        """Seconds a still-running object has been running."""
        if start is None:
            return None
        return seconds_between(start, now or datetime.now(timezone.utc))
  kube.py: |
    """The only module that talks to the Kubernetes API.

    Everything above this layer works on plain dictionaries, which is deliberate:
    the official client returns generated model classes whose nesting is awkward to
    read and impossible to construct by hand in a test. One conversion happens
    here, on the way out, and nothing above has to know the client exists.

    Connection is attempted three ways, in the order that is right for the place
    this runs:

      1. in-cluster, using the pod's service account - what happens on the cluster
      2. a kubeconfig on disk - what happens on a workstation with ``kubectl``
      3. an explicit API server, host and port - what happens on a workstation
         with a token and no kubeconfig

    The third is last because it cannot discover anything: it needs the address to
    be configured rather than found.
    """

    from __future__ import annotations

    import copy
    import logging
    import secrets
    import string
    from typing import Any, Protocol

    from kubernetes import client, config
    from kubernetes.client.rest import ApiException

    from config import Settings
    from naming import build_run_name, instantiate_annotations, instantiate_labels

    LOGGER = logging.getLogger(__name__)

    #: The label the Job controller puts on every pod it owns. Selecting pods by it
    #: is more reliable than the Job's own ``spec.selector``, which is absent until
    #: the controller has written it.
    JOB_NAME_LABEL = "job-name"

    #: Name label the browser uses to know which project a run belongs to.
    APP_NAME_LABEL = "app.kubernetes.io/name"

    #: How many alternative names to try when a Job name is already taken. Two
    #: clicks in the same second collide; a handful of attempts resolves it without
    #: a loop that could spin.
    NAME_ATTEMPTS = 5

    _DISCRIMINATOR_ALPHABET = string.ascii_lowercase + string.digits
    _DISCRIMINATOR_LENGTH = 4


    class KubernetesUnavailable(RuntimeError):
        """No API client could be built, so nothing can be served."""


    class KubernetesRequestFailed(RuntimeError):
        """The API server answered with an error status."""

        def __init__(self, message: str, status: int = 500, reason: str = "") -> None:
            super().__init__(message)
            self.status = status
            self.reason = reason


    class NotFound(KubernetesRequestFailed):
        """The object asked for does not exist."""


    def _serialize(api: client.ApiClient, obj: Any) -> dict[str, Any]:
        """Convert a client model into the JSON dictionary the API would return."""
        if obj is None:
            return {}
        return api.sanitize_for_serialization(obj)


    def _translate(exc: ApiException, action: str) -> KubernetesRequestFailed:
        """Turn a client exception into one of the two errors above."""
        status = int(exc.status or 500)
        reason = str(exc.reason or "").strip()
        detail = ""
        body = getattr(exc, "body", None)
        if isinstance(body, str) and body:
            detail = body.strip()
        elif isinstance(body, dict):
            detail = str(body.get("message") or "").strip()
        message = f"{action}: {reason or 'request failed'}"
        if detail and detail != reason:
            message = f"{message} ({detail})"
        if status == 404:
            return NotFound(message, status, reason)
        return KubernetesRequestFailed(message, status, reason)


    def _discriminator() -> str:
        """A short random token appended to a Job name to break a tie."""
        return "".join(
            secrets.choice(_DISCRIMINATOR_ALPHABET) for _ in range(_DISCRIMINATOR_LENGTH)
        )


    class Gateway(Protocol):
        """The operations the front end performs on a namespace.

        Written down as a protocol because there are two implementations: the real
        one below, and the in-memory double the tests and ``tools/dev-server.py``
        pass to :func:`app.create_app`. Neither inherits from the other - the double
        deliberately does not import the Kubernetes client - so this is what makes
        the substitution type-check instead of being an unchecked ``Any``.
        """

        @property
        def connected(self) -> bool: ...

        @property
        def error(self) -> str: ...

        @property
        def server_version(self) -> str: ...

        @property
        def namespace(self) -> str: ...

        def require(self) -> None: ...

        def list_cronjobs(self) -> list[dict[str, Any]]: ...

        def get_cronjob(self, name: str) -> dict[str, Any]: ...

        def set_cronjob_suspended(self, name: str, suspended: bool) -> dict[str, Any]: ...

        def list_jobs(self) -> list[dict[str, Any]]: ...

        def get_job(self, name: str) -> dict[str, Any]: ...

        def create_job_from_cronjob(self, cronjob_name: str) -> dict[str, Any]: ...

        def delete_job(self, name: str) -> None: ...

        def pods_for_job(self, job_name: str) -> list[dict[str, Any]]: ...

        def pod_logs(
            self, job_name: str, container: str = "", tail: int = 2000
        ) -> dict[str, Any]: ...

        def quota_usage(self) -> list[dict[str, Any]]: ...


    class KubernetesGateway:
        """Everything the front end can do to the cluster, in one place.

        Deliberately not a general-purpose client. It exposes the seven operations
        this UI performs and nothing else, so the RBAC in
        ``kubernetes/workloads/web-frontend.yaml`` can stay as narrow as it is.
        """

        def __init__(self, settings: Settings) -> None:
            self._settings = settings
            self._api: client.ApiClient | None = None
            self._batch: client.BatchV1Api | None = None
            self._core: client.CoreV1Api | None = None
            self._connected = False
            self._error = ""
            self._server_version = ""
            self._timeout = settings.kube_timeout_seconds

        # -- connection ---------------------------------------------------------

        def connect(self) -> None:
            """Try each configuration source in turn and keep the first that works.

            Called once at start-up. A failure is recorded rather than raised: the
            web server should start and report *why* it cannot reach the cluster,
            instead of a crash loop that only shows the reason in a container log
            nobody is watching.
            """
            attempts = (
                ("in-cluster", self._use_incluster),
                ("kubeconfig", self._use_kubeconfig),
                ("configured host", self._use_explicit),
            )
            failures: list[str] = []
            for label, strategy in attempts:
                try:
                    strategy()
                except Exception as exc:  # noqa: BLE001 - every failure is reported
                    failures.append(f"{label}: {exc}")
                    continue
                self._build_clients()
                self._connected = True
                self._error = ""
                self._server_version = self._read_server_version()
                LOGGER.info(
                    "connected to the Kubernetes API via %s at %s",
                    label,
                    self._api.configuration.host if self._api else "?",
                )
                return
            self._connected = False
            self._error = "; ".join(failures) or "no usable Kubernetes configuration"

        def _use_incluster(self) -> None:
            """Inside a pod: the mounted service account and the cluster CA."""
            config.load_incluster_config()

        def _use_kubeconfig(self) -> None:
            """On a workstation: whatever ``kubectl`` already uses."""
            config.load_kube_config()

        def _use_explicit(self) -> None:
            """Configured address and token, for a host with no kubeconfig."""
            configuration = client.Configuration()
            configuration.host = self._settings.api_server
            configuration.verify_ssl = self._settings.verify_ssl
            configuration.api_key = {}
            if self._settings.kube_ca_file:
                configuration.ssl_ca_cert = self._settings.kube_ca_file
            if self._settings.kube_token:
                # The value is a bearer token; the client writes it into the
                # Authorization header. It is never logged.
                configuration.api_key["authorization"] = self._settings.kube_token
            configuration.retries = 0
            client.Configuration.set_default(configuration)

        def _build_clients(self) -> None:
            self._api = client.ApiClient()
            self._batch = client.BatchV1Api(self._api)
            self._core = client.CoreV1Api(self._api)

        def _read_server_version(self) -> str:
            """Best effort: a version string is decoration, not a dependency."""
            try:
                version = client.VersionApi(self._api).get_code()
                return str(version.git_version or "")
            except Exception as exc:  # noqa: BLE001 - never fatal
                LOGGER.debug("could not read the server version: %s", exc)
                return ""

        @property
        def connected(self) -> bool:
            return self._connected

        @property
        def error(self) -> str:
            return self._error

        @property
        def server_version(self) -> str:
            return self._server_version

        @property
        def namespace(self) -> str:
            return self._settings.namespace

        def require(self) -> None:
            """Raise unless a client is ready, so routes fail fast and clearly."""
            if not self._connected or self._batch is None or self._core is None:
                raise KubernetesUnavailable(
                    f"Kubernetes API not reachable: {self._error or 'not connected'}"
                )

        # -- CronJobs (build projects) ------------------------------------------

        def list_cronjobs(self) -> list[dict[str, Any]]:
            """Every scheduled build definition in the namespace."""
            self.require()
            try:
                result = self._batch.list_namespaced_cron_job(
                    self.namespace, _request_timeout=self._timeout
                )
            except ApiException as exc:
                raise _translate(exc, "listing build projects") from exc
            return [_serialize(self._api, item) for item in (result.items or [])]

        def get_cronjob(self, name: str) -> dict[str, Any]:
            self.require()
            try:
                cronjob = self._batch.read_namespaced_cron_job(
                    name, self.namespace, _request_timeout=self._timeout
                )
            except ApiException as exc:
                raise _translate(exc, f"reading build project '{name}'") from exc
            return _serialize(self._api, cronjob)

        def set_cronjob_suspended(self, name: str, suspended: bool) -> dict[str, Any]:
            """Pause or resume a schedule.

            A merge patch, not a replace: the CronJob is one object many people
            touch, and sending the whole spec back would undo any change made
            between our read and our write.
            """
            self.require()
            try:
                cronjob = self._batch.patch_namespaced_cron_job(
                    name,
                    self.namespace,
                    {"spec": {"suspend": bool(suspended)}},
                    _request_timeout=self._timeout,
                )
            except ApiException as exc:
                verb = "pausing" if suspended else "resuming"
                raise _translate(exc, f"{verb} build project '{name}'") from exc
            return _serialize(self._api, cronjob)

        # -- Jobs (runs) --------------------------------------------------------

        def list_jobs(self) -> list[dict[str, Any]]:
            """Every run in the namespace, finished or not."""
            self.require()
            try:
                result = self._batch.list_namespaced_job(
                    self.namespace, _request_timeout=self._timeout
                )
            except ApiException as exc:
                raise _translate(exc, "listing build runs") from exc
            return [_serialize(self._api, item) for item in (result.items or [])]

        def get_job(self, name: str) -> dict[str, Any]:
            self.require()
            try:
                job = self._batch.read_namespaced_job(
                    name, self.namespace, _request_timeout=self._timeout
                )
            except ApiException as exc:
                raise _translate(exc, f"reading build run '{name}'") from exc
            return _serialize(self._api, job)

        def create_job_from_cronjob(self, cronjob_name: str) -> dict[str, Any]:
            """Start one run of a build project, now.

            The same thing ``kubectl create job --from=cronjob`` does: copy the job
            template into a new Job so an on-demand run is identical to a scheduled
            one. The CronJob stays the single definition of how a project builds.
            """
            cronjob = self.get_cronjob(cronjob_name)
            last_error: KubernetesRequestFailed | None = None
            for attempt in range(NAME_ATTEMPTS):
                job_name = build_run_name(
                    cronjob_name, discriminator="" if attempt == 0 else _discriminator()
                )
                body = build_job_body(cronjob, job_name)
                try:
                    created = self._batch.create_namespaced_job(
                        self.namespace, body, _request_timeout=self._timeout
                    )
                except ApiException as exc:
                    last_error = _translate(exc, f"starting a build of '{cronjob_name}'")
                    # 409 is the name already existing - two clicks in the same
                    # second. Anything else is a real refusal and is reported now.
                    if int(exc.status or 0) == 409 and attempt < NAME_ATTEMPTS - 1:
                        continue
                    raise last_error from exc
                return _serialize(self._api, created)
            raise last_error or KubernetesRequestFailed(
                f"could not find an unused name for a run of '{cronjob_name}'", 409
            )

        def delete_job(self, name: str) -> None:
            """Remove a run and, by background propagation, its pod.

            Background rather than foreground: a foreground delete waits for the
            pod to disappear, and the pod of a stuck build does not always do that
            quickly. Leaving the pod to be reaped afterwards keeps the request
            short and the UI responsive.
            """
            self.require()
            try:
                self._batch.delete_namespaced_job(
                    name,
                    self.namespace,
                    body=client.V1DeleteOptions(propagation_policy="Background"),
                    _request_timeout=self._timeout,
                )
            except ApiException as exc:
                raise _translate(exc, f"deleting build run '{name}'") from exc

        # -- pods and logs ------------------------------------------------------

        def pods_for_job(self, job_name: str) -> list[dict[str, Any]]:
            """The pods a Job created, newest first."""
            self.require()
            try:
                result = self._core.list_namespaced_pod(
                    self.namespace,
                    label_selector=f"{JOB_NAME_LABEL}={job_name}",
                    _request_timeout=self._timeout,
                )
            except ApiException as exc:
                raise _translate(exc, f"listing pods for run '{job_name}'") from exc
            pods = [_serialize(self._api, item) for item in (result.items or [])]
            pods.sort(
                key=lambda pod: str((pod.get("metadata") or {}).get("creationTimestamp") or ""),
                reverse=True,
            )
            return pods

        def pod_logs(
            self, job_name: str, container: str = "", tail: int = 2000
        ) -> dict[str, Any]:
            """Logs for one container of a run's newest pod.

            A container that has not started yet makes the API answer 400 rather
            than return an empty log, so that case is turned into a note the UI can
            show instead of an error the user has to interpret.
            """
            pods = self.pods_for_job(job_name)
            if not pods:
                return {
                    "logs": "",
                    "pod": "",
                    "container": "",
                    "note": "No pod yet - the run has not been scheduled.",
                }
            pod = pods[0]
            pod_name = str((pod.get("metadata") or {}).get("name") or "")
            pod_spec = pod.get("spec") or {}
            available = [
                str(item.get("name"))
                for item in (pod_spec.get("initContainers") or [])
                + (pod_spec.get("containers") or [])
                if item.get("name")
            ]
            chosen = container if container in available else ""
            if not chosen:
                regular = [
                    str(item.get("name"))
                    for item in pod_spec.get("containers") or []
                    if item.get("name")
                ]
                chosen = regular[-1] if regular else (available[0] if available else "")
            if not chosen:
                return {
                    "logs": "",
                    "pod": pod_name,
                    "container": "",
                    "note": "The pod declares no containers yet.",
                }
            try:
                logs = self._core.read_namespaced_pod_log(
                    pod_name,
                    self.namespace,
                    container=chosen,
                    tail_lines=tail,
                    _request_timeout=self._timeout,
                )
            except ApiException as exc:
                status = int(exc.status or 0)
                if status == 400:
                    return {
                        "logs": "",
                        "pod": pod_name,
                        "container": chosen,
                        "note": f"'{chosen}' has not started yet.",
                    }
                if status == 404:
                    return {
                        "logs": "",
                        "pod": pod_name,
                        "container": chosen,
                        "note": "The pod is gone; its log went with it.",
                    }
                raise _translate(exc, f"reading the log of '{chosen}'") from exc
            return {
                "logs": logs or "",
                "pod": pod_name,
                "container": chosen,
                "note": "",
            }

        # -- namespace capacity -------------------------------------------------

        def quota_usage(self) -> list[dict[str, Any]]:
            """ResourceQuota used versus hard, for the namespace.

            This is what explains a run stuck in ``blocked``: the namespace allows
            16 pods and each build holds a virtual machine, so "no capacity" is a
            normal answer and the UI should be able to say so precisely.
            """
            self.require()
            try:
                result = self._core.list_namespaced_resource_quota(
                    self.namespace, _request_timeout=self._timeout
                )
            except ApiException as exc:
                raise _translate(exc, "reading namespace capacity") from exc
            quotas: list[dict[str, Any]] = []
            for item in result.items or []:
                serialized = _serialize(self._api, item)
                status = serialized.get("status") or {}
                quotas.append(
                    {
                        "name": (serialized.get("metadata") or {}).get("name", ""),
                        "hard": dict(status.get("hard") or {}),
                        "used": dict(status.get("used") or {}),
                    }
                )
            return quotas


    def build_job_body(cronjob: dict[str, Any], job_name: str) -> dict[str, Any]:
        """The Job to create for one on-demand run of ``cronjob``.

        Faithful to ``kubectl create job --from=cronjob``:

        * the spec is the job template's, deep-copied so the caller's object is
          never mutated;
        * ``selector`` and ``manualSelector`` are dropped. A copied selector would
          name the pods of whichever Job it came from, and the new Job's pods would
          then never be selected. Leaving both unset has the controller generate a
          fresh selector from the pod template's labels, which is the correct
          outcome and what ``kubectl`` relies on too;
        * the pod template's server-populated metadata is dropped for the same
          reason: it describes the object that was read, not the one to create;
        * ``cronjob.kubernetes.io/instantiate: manual`` marks the run as started by
          hand, in the label and the annotation, exactly as ``kubectl`` writes it;
        * the CronJob's own ``packer.io/*`` labels are copied onto the Job, because
          they live on the CronJob (a family, for instance) and not on the job
          template, so without this a run would not say which family it belongs to.

        A pure function: it takes a serialised CronJob and returns the body to
        POST, with no client and no I/O, so it can be checked in a unit test.
        """
        meta = cronjob.get("metadata") or {}
        template = (cronjob.get("spec") or {}).get("jobTemplate") or {}
        template_meta = template.get("metadata") or {}
        job_spec = copy.deepcopy(template.get("spec") or {})

        job_spec.pop("selector", None)
        job_spec.pop("manualSelector", None)

        pod_meta = (job_spec.get("template") or {}).get("metadata")
        if isinstance(pod_meta, dict):
            for key in ("creationTimestamp", "resourceVersion", "uid", "managedFields"):
                pod_meta.pop(key, None)

        labels = instantiate_labels(template_meta.get("labels"))
        cronjob_name = str(meta.get("name") or "")
        if cronjob_name:
            labels[APP_NAME_LABEL] = cronjob_name
        for key, value in (meta.get("labels") or {}).items():
            if key.startswith("packer.io/") and key not in labels:
                labels[key] = value

        body: dict[str, Any] = {
            "apiVersion": "batch/v1",
            "kind": "Job",
            "metadata": {
                "name": job_name,
                "labels": labels,
                "annotations": instantiate_annotations(template_meta.get("annotations")),
            },
            "spec": job_spec,
        }
        namespace = meta.get("namespace")
        if namespace:
            body["metadata"]["namespace"] = namespace
        return body
  naming.py: |
    """Names and labels for a manual run.

    ``kubectl create job --from=cronjob/X Y`` is the behaviour this module
    reproduces, because the pipeline uses exactly that command and a run started
    from the browser has to be indistinguishable from one started from a terminal.

    What ``kubectl`` does that a naive copy of ``jobTemplate.spec`` does not:

      * gives the Job a name of its own, since the template has none;
      * stamps ``cronjob.kubernetes.io/instantiate: manual`` on it, which is how a
        person later tells an on-demand run apart from a scheduled one;
      * clears the object metadata that cannot be re-submitted
        (``resourceVersion``, ``uid``, ``creationTimestamp``, ``managedFields``);
      * leaves ``spec.selector`` unset so the Job controller generates one from the
        pod template's labels. Copying a selector would be copied from a Job that
        already exists and would collide.

    Kubernetes object names are DNS-1123 labels: lowercase alphanumerics and
    ``-``, starting and ending alphanumeric, at most 63 characters.
    """

    from __future__ import annotations

    import re
    from datetime import datetime, timezone

    #: Kubernetes' limit for most object names, including Jobs.
    MAX_NAME_LENGTH = 63

    #: The label and annotation that mark a Job as an on-demand instantiation.
    INSTANTIATE_KEY = "cronjob.kubernetes.io/instantiate"
    INSTANTIATE_VALUE = "manual"

    #: Set by this front end so the source of a run is visible in ``kubectl get``.
    CREATED_BY_KEY = "aria-automation/created-by"
    CREATED_BY_VALUE = "web-frontend"

    #: Labels copied from a CronJob that describe what a run builds.
    PROJECT_LABEL = "packer.io/project"
    FAMILY_LABEL = "packer.io/family"

    _INVALID_NAME_CHARS = re.compile(r"[^a-z0-9-]+")
    _REPEATED_DASHES = re.compile(r"-{2,}")


    def sanitize_name(value: str) -> str:
        """Coerce ``value`` into a DNS-1123 label, never returning an empty string.

        Used for the pieces a Job name is built from. ``"Photon 5"`` becomes
        ``"photon-5"``; anything that sanitises to nothing becomes ``"build"`` so
        the caller still has a usable stem.
        """
        lowered = (value or "").strip().lower()
        replaced = _INVALID_NAME_CHARS.sub("-", lowered)
        collapsed = _REPEATED_DASHES.sub("-", replaced).strip("-")
        return collapsed or "build"


    def _timestamp_suffix(moment: datetime) -> str:
        """``20261026-150800`` - sortable, and unambiguous in a list of runs."""
        return moment.astimezone(timezone.utc).strftime("%Y%m%d-%H%M%S")


    def build_run_name(
        cronjob_name: str,
        moment: datetime | None = None,
        discriminator: str = "",
    ) -> str:
        """Name for an on-demand Job started from ``cronjob_name``.

        ``discriminator`` exists because two clicks inside the same second would
        otherwise produce the same name and the second would be rejected with a
        409. The caller passes a short token and retries with another one.

        The result is always a valid, non-empty DNS-1123 label of at most 63
        characters - the CronJob's own name is trimmed if the timestamp would push
        it over.
        """
        when = moment or datetime.now(timezone.utc)
        stem = sanitize_name(cronjob_name)
        suffix = f"-manual-{_timestamp_suffix(when)}"
        if discriminator:
            suffix = f"{suffix}-{sanitize_name(discriminator)}"

        room = MAX_NAME_LENGTH - len(suffix)
        if room < 1:
            # The suffix alone is 22 characters, so this cannot happen with a real
            # CronJob; trimming anyway keeps the function total.
            return suffix.lstrip("-")[:MAX_NAME_LENGTH]
        trimmed = stem[:room].rstrip("-")
        return f"{trimmed or 'build'}{suffix}"


    def instantiate_labels(base_labels: dict[str, str] | None) -> dict[str, str]:
        """Labels for a manual run: the template's, plus the manual-run marker."""
        labels = dict(base_labels or {})
        labels[INSTANTIATE_KEY] = INSTANTIATE_VALUE
        labels[CREATED_BY_KEY] = CREATED_BY_VALUE
        return labels


    def instantiate_annotations(base_annotations: dict[str, str] | None) -> dict[str, str]:
        """Annotations for a manual run.

        ``cronjob.kubernetes.io/instantiate`` is also recorded as an annotation
        because that is what ``kubectl`` writes, and tooling (and people) look for
        it in both places.
        """
        annotations = dict(base_annotations or {})
        annotations[INSTANTIATE_KEY] = INSTANTIATE_VALUE
        return annotations


    def is_manual_run(labels: dict[str, str] | None, annotations: dict[str, str] | None) -> bool:
        """Whether a Job was started on demand rather than by its schedule."""
        for source in (labels or {}, annotations or {}):
            if source.get(INSTANTIATE_KEY) == INSTANTIATE_VALUE:
                return True
        return False
  pages.py: |
    """The HTML side: three pages, and a plain-text probe.

    The application is three pages rather than one long scroll, because they answer
    three different questions and are used at different moments:

    ``/``       what state is the namespace in, and is anything wrong right now
    ``/build``  start a run, or pause a schedule
    ``/runs``   what happened - the run list, logs, and deleting a run

    Every page is a shell. Everything inside it is drawn from ``/api/overview`` by
    that page's own script, so nothing the server renders comes from Kubernetes and
    no page has a template that knows about projects or runs. That keeps every
    escaping decision in one place: the browser uses ``textContent`` and
    ``document.createElement``, never ``innerHTML`` with a value from the cluster.

    The pages share ``templates/base.html``, which owns the top bar, the navigation
    and the theme. Adding a page means a template that extends it plus one entry in
    :data:`PAGES`.
    """

    from __future__ import annotations

    from flask import Blueprint, Response, render_template

    from services import current_services

    bp = Blueprint("pages", __name__)

    #: page id -> (template, browser script, window title).
    #:
    #: The page id is also what ``body[data-page]`` carries and what the stylesheet
    #: and the nav use, so one name per page is enough.
    PAGES: dict[str, tuple[str, str, str]] = {
        "landing": ("landing.html", "landing.js", "Overview"),
        "build": ("build.html", "build.js", "Build"),
        "runs": ("runs.html", "runs.js", "Runs"),
    }


    def _render(page: str) -> str:
        """Render one page's shell.

        The values baked into the HTML are the ones needed before the first API call
        returns, so a page does not have to flash an empty state while it waits.
        """
        template, script, title = PAGES[page]
        settings = current_services().settings
        return render_template(
            template,
            page=page,
            page_title=title,
            page_script=script,
            namespace=settings.namespace,
            refresh_seconds=settings.refresh_seconds,
            can_mutate=settings.can_mutate,
            log_tail=settings.log_tail_default,
        )


    @bp.get("/")
    def landing() -> str:
        """The overview: counts, capacity, what needs attention, latest runs."""
        return _render("landing")


    @bp.get("/build")
    def build() -> str:
        """The build projects, with the controls that start and pause them."""
        return _render("build")


    @bp.get("/runs")
    def runs() -> str:
        """Every run, with filters, logs and delete.

        The filters are read from the query string by ``static/runs.js`` rather than
        here: they only change what is shown, never what is fetched, so a link such
        as ``/runs?project=aria-build-photon-5&show=failed`` is just this page.
        """
        return _render("runs")


    @bp.get("/healthz")
    def healthz() -> Response:
        """A probe with no dependencies.

        Separate from ``/api/health`` on purpose: the liveness probe must answer
        "is the web server running", and the moment it also answers "is the cluster
        reachable" it starts restarting a healthy server for an unrelated outage.
        """
        return Response("ok\n", mimetype="text/plain")
  projects.py: |
    """A CronJob, described as the build project a user sees.

    One CronJob is one thing a user can ask for: "rebuild the Photon OS 5
    template". Everything a person needs in order to decide whether to press the
    button belongs here - when it last ran, whether that worked, how it is
    scheduled, and what it will actually build - so the browser does not have to
    join anything together itself.

    The ``health`` field collapses the run history into the one thing a user
    glances at:

    ``ok``         the last run succeeded
    ``failing``    the last run failed
    ``running``    a run is in progress right now
    ``suspended``  the schedule is disabled, so nothing will start by itself
    ``never``      it has never run
    """

    from __future__ import annotations

    from typing import Any

    from naming import FAMILY_LABEL, PROJECT_LABEL
    from runs import PROJECT_PREFIX

    #: Annotation this repository uses to say what a project is for.
    PURPOSE_ANNOTATION = "aria-automation/purpose"

    #: Environment variables worth showing: they say what a build produces.
    BUILD_PARAMETER_NAMES = ("PACKER_PROJECT", "PACKER_BUILD_ARGS", "GIT_REF")

    _ACTIVE_STATES = frozenset({"running", "blocked", "pending"})


    def _metadata(obj: dict[str, Any]) -> dict[str, Any]:
        return obj.get("metadata") or {}


    def _spec(obj: dict[str, Any]) -> dict[str, Any]:
        return obj.get("spec") or {}


    def _job_template(cronjob: dict[str, Any]) -> dict[str, Any]:
        return _spec(cronjob).get("jobTemplate") or {}


    def _pod_spec(cronjob: dict[str, Any]) -> dict[str, Any]:
        """The pod template, buried at ``jobTemplate.spec.template.spec``.

        Three levels, not two: ``jobTemplate`` has its own ``spec`` (the Job's) and
        the pod template is inside that. Reaching for ``jobTemplate.template``
        finds nothing, which silently reports a project with no containers, no
        volumes and therefore no required Secrets - an empty card rather than an
        error, which is the worst way for this to fail.
        """
        job_spec = _job_template(cronjob).get("spec") or {}
        template = job_spec.get("template") or {}
        return template.get("spec") or {}


    def project_name(cronjob: dict[str, Any]) -> str:
        """What the project builds, from the labels then the CronJob's name.

        ``packer.io/project`` is set on the job template in every CronJob in this
        repository, so the label is normally enough. The name is the fallback for a
        CronJob someone added without following the convention - a slightly ugly
        project name beats an empty column.
        """
        template_labels = (_job_template(cronjob).get("metadata") or {}).get("labels") or {}
        cronjob_labels = _metadata(cronjob).get("labels") or {}
        for source in (template_labels, cronjob_labels):
            value = source.get(PROJECT_LABEL)
            if value:
                return str(value)
        name = str(_metadata(cronjob).get("name") or "")
        if name.startswith(PROJECT_PREFIX):
            return name[len(PROJECT_PREFIX) :]
        return name


    def family_name(cronjob: dict[str, Any]) -> str:
        """``linux``, ``windows``, or nothing if the CronJob does not say."""
        template_labels = (_job_template(cronjob).get("metadata") or {}).get("labels") or {}
        cronjob_labels = _metadata(cronjob).get("labels") or {}
        for source in (template_labels, cronjob_labels):
            value = source.get(FAMILY_LABEL)
            if value:
                return str(value)
        return ""


    def required_secrets(cronjob: dict[str, Any]) -> list[str]:
        """Secrets the pod cannot start without.

        Both ways a build job gets a Secret are used in this repository: a volume
        (``pkrvars-<project>``) and ``envFrom`` (``aria-repo-credentials`` on the
        checkout init container). A missing one leaves the pod Pending for ever
        with a message that says so - worth showing before the user presses Build,
        not after.
        """
        pod = _pod_spec(cronjob)
        names: list[str] = []
        for volume in pod.get("volumes") or []:
            secret = volume.get("secret") or {}
            name = secret.get("secretName")
            # ``optional: true`` means the pod starts without it by design.
            if name and not secret.get("optional"):
                names.append(str(name))
        for container in (pod.get("initContainers") or []) + (pod.get("containers") or []):
            for source in container.get("envFrom") or []:
                reference = source.get("secretRef") or {}
                name = reference.get("name")
                if name and not reference.get("optional"):
                    names.append(str(name))
        return sorted(set(names))


    def required_config_maps(cronjob: dict[str, Any]) -> list[str]:
        """ConfigMaps mounted into the pod, which is how its scripts arrive."""
        pod = _pod_spec(cronjob)
        names: list[str] = []
        for volume in pod.get("volumes") or []:
            config_map = volume.get("configMap") or {}
            name = config_map.get("name")
            if name and not config_map.get("optional"):
                names.append(str(name))
        return sorted(set(names))


    def template_parameters(cronjob: dict[str, Any]) -> dict[str, str]:
        """The build parameters declared on the CronJob's own container.

        A whitelist, and only literal ``value`` entries: anything from a Secret or
        a ConfigMap has no value in the spec and is skipped, which is the point -
        the Packer credentials never reach the browser.
        """
        containers = _pod_spec(cronjob).get("containers") or []
        if not containers:
            return {}
        found: dict[str, str] = {}
        for entry in containers[-1].get("env") or []:
            name = entry.get("name")
            value = entry.get("value")
            if name in BUILD_PARAMETER_NAMES and isinstance(value, str):
                found[name] = value
        return found


    def project_health(runs: list[dict[str, Any]], suspended: bool) -> str:
        """The one-word state of a project, from its runs and its schedule.

        A live run wins over everything: a project whose schedule has been paused
        while a build is still going is not "suspended" to the person watching it.
        """
        if any(run.get("state") in _ACTIVE_STATES for run in runs):
            return "running"
        if suspended:
            return "suspended"
        if not runs:
            return "never"
        latest = max(runs, key=lambda run: str(run.get("createdAt") or ""))
        return "ok" if latest.get("state") == "succeeded" else "failing"


    def summarise_project(
        cronjob: dict[str, Any],
        runs: list[dict[str, Any]] | None = None,
    ) -> dict[str, Any]:
        """Turn a CronJob and its runs into the project dictionary the API returns.

        ``runs`` must already be summarised and already filtered to this CronJob -
        see :func:`group_runs`. Doing the join in the caller keeps this function
        free of any Kubernetes access and therefore testable as a pure function.
        """
        meta = _metadata(cronjob)
        spec = _spec(cronjob)
        status = cronjob.get("status") or {}
        ordered = sorted(
            runs or [], key=lambda run: str(run.get("createdAt") or ""), reverse=True
        )

        suspended = bool(spec.get("suspend", False))
        active = [run for run in ordered if run.get("state") in _ACTIVE_STATES]

        return {
            "name": meta.get("name", ""),
            "namespace": meta.get("namespace", ""),
            "project": project_name(cronjob),
            "family": family_name(cronjob),
            "purpose": (meta.get("annotations") or {}).get(PURPOSE_ANNOTATION, ""),
            "schedule": spec.get("schedule", ""),
            "timezone": spec.get("timeZone", "") or spec.get("timezone", ""),
            "suspend": suspended,
            "concurrencyPolicy": spec.get("concurrencyPolicy", ""),
            "startingDeadlineSeconds": spec.get("startingDeadlineSeconds"),
            "successfulJobsHistoryLimit": spec.get("successfulJobsHistoryLimit"),
            "failedJobsHistoryLimit": spec.get("failedJobsHistoryLimit"),
            "lastScheduleTime": status.get("lastScheduleTime", ""),
            "createdAt": meta.get("creationTimestamp", ""),
            "health": project_health(ordered, suspended),
            "latestRun": ordered[0] if ordered else None,
            "lastSuccess": next(
                (run for run in ordered if run.get("state") == "succeeded"), None
            ),
            "lastFailure": next(
                (run for run in ordered if run.get("state") == "failed"), None
            ),
            "activeRuns": len(active),
            "runCount": len(ordered),
            "parameters": template_parameters(cronjob),
            "containers": [
                container.get("name", "")
                for container in _pod_spec(cronjob).get("containers") or []
                if container.get("name")
            ],
            "initContainers": [
                container.get("name", "")
                for container in _pod_spec(cronjob).get("initContainers") or []
                if container.get("name")
            ],
            "requiredSecrets": required_secrets(cronjob),
            "requiredConfigMaps": required_config_maps(cronjob),
            "annotations": dict(meta.get("annotations") or {}),
            "labels": dict(meta.get("labels") or {}),
        }


    def group_runs(runs: list[dict[str, Any]]) -> dict[str, list[dict[str, Any]]]:
        """Index already-summarised runs by the CronJob they belong to."""
        grouped: dict[str, list[dict[str, Any]]] = {}
        for run in runs:
            cronjob = str(run.get("cronjob") or "")
            grouped.setdefault(cronjob, []).append(run)
        return grouped


    def sort_projects(projects: list[dict[str, Any]]) -> list[dict[str, Any]]:
        """Family, then project name: the order the cards are read in.

        ``zzz`` for a project with no family sorts those last rather than first,
        which would be the result of sorting on an empty string.
        """
        return sorted(
            projects,
            key=lambda project: (
                str(project.get("family") or "zzz"),
                str(project.get("project") or ""),
            ),
        )
  quantities.py: |
    """Parse the quantity strings Kubernetes writes in its API.

    A container asks for ``500m`` of CPU and ``4Gi`` of memory; a ResourceQuota
    says it will allow ``16`` pods and ``32Gi`` of memory. Those are not numbers,
    and comparing them needs the units resolved first.

    Only two things are needed here: turn a quantity into a number of base units,
    and know whether it is a decimal or a binary one so it can be printed back the
    way it arrived. Nothing in this module raises on unexpected input - a quantity
    the API wrote that this cannot read becomes ``None``, and the caller shows the
    raw string instead of a percentage.
    """

    from __future__ import annotations

    import re
    from dataclasses import dataclass

    #: Kubernetes' suffixes. The binary ones (``Ki``) are powers of 1024 and the
    #: decimal ones (``k``) powers of 1000 - mixing them up understates memory by
    #: about 2.4% per step, which is enough to make a full namespace look empty.
    _BINARY = {"Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4, "Pi": 1024**5, "Ei": 1024**6}
    _DECIMAL = {"k": 1e3, "M": 1e6, "G": 1e9, "T": 1e12, "P": 1e15, "E": 1e18}
    _SUBNORMAL = {"n": 1e-9, "u": 1e-6, "m": 1e-3}

    _QUANTITY = re.compile(r"^(?P<number>[+-]?\d+(?:\.\d+)?)(?P<suffix>[A-Za-z]*)$")


    @dataclass(frozen=True)
    class Quantity:
        """A parsed quantity: its value in base units, and its original text."""

        value: float
        suffix: str
        raw: str

        @property
        def is_binary(self) -> bool:
            return self.suffix in _BINARY

        def ratio_to(self, other: "Quantity | None") -> float | None:
            """This value as a fraction of ``other``, clamped to ``0..1``.

            Returns ``None`` when the comparison cannot be made - an empty quota,
            or one measured in different units, where a percentage would be a
            fabrication.
            """
            if other is None or other.value <= 0:
                return None
            return max(0.0, min(1.0, self.value / other.value))


    def parse(raw: str | None) -> Quantity | None:
        """Parse a Kubernetes quantity, or ``None`` if it is not one."""
        if raw is None:
            return None
        text = str(raw).strip()
        if not text:
            return None
        match = _QUANTITY.match(text)
        if match is None:
            return None
        number = float(match.group("number"))
        suffix = match.group("suffix")
        if suffix in _BINARY:
            return Quantity(number * _BINARY[suffix], suffix, text)
        if suffix in _DECIMAL:
            return Quantity(number * _DECIMAL[suffix], suffix, text)
        if suffix in _SUBNORMAL:
            return Quantity(number * _SUBNORMAL[suffix], suffix, text)
        if suffix:
            # Something with a unit this module does not know, such as a percentage.
            # Reported as unparseable rather than guessed at.
            return None
        return Quantity(number, "", text)


    def percent_used(used: str | None, hard: str | None) -> int | None:
        """``used`` as a whole percentage of ``hard``, or ``None``.

        Integer percentages, not floats: the caller writes this into a bar width
        and a rounded number is all it needs.
        """
        used_quantity = parse(used)
        hard_quantity = parse(hard)
        ratio = used_quantity.ratio_to(hard_quantity) if used_quantity else None
        if ratio is None:
            return None
        return int(round(ratio * 100))


    def humanise(value: str | None) -> str:
        """``4Gi`` stays ``4Gi``; an unreadable quantity is shown as it arrived."""
        return str(value) if value not in (None, "") else "0"
