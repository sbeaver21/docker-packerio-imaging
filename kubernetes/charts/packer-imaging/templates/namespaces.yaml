{{- if .Values.namespaces.create }}
# Two namespaces: the builds, and the web front end that reads them. The front
# end's RBAC into the builds namespace is granted by
# kubernetes/workloads/web-frontend.yaml, which must be applied after this.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.builds }}
  labels:
    {{- include "packer-imaging.labels" . | nindent 4 }}
    # Enforce the LimitRange default on pods that declare no resources of their
    # own, so a hand-started Job cannot bypass the quota by omitting limits.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.frontend }}
  labels:
    {{- include "packer-imaging.labels" . | nindent 4 }}
    # Warn, not enforce. The front end publishes on the node's port 80 through
    # `hostPort`, which the baseline profile forbids. Enforcing baseline here
    # stops the very Deployment this namespace exists for: the ReplicaSet loops
    # on "violates PodSecurity: hostPort" and no pod is ever created. Warning
    # keeps it visible without blocking. The build namespace above keeps
    # `baseline` enforced, because those pods do comply.
    pod-security.kubernetes.io/warn: baseline
{{- end }}
